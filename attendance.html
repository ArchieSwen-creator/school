<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Attendance | EduCore</title>
<style>
  :root{
    --navy:#12315a;--navy2:#14213d;--blue:#3987ee;--pale:#eef5ff;--border:#d8e4f2;
    --text:#23354d;--muted:#73849a;--green:#14805e;--orange:#d88922;--red:#d64545;
    --gold:#c99a2e;--gold2:#fff4d6;--bg:#f5f7fb;--line:#e8ebf2;--white:#fff;
    --shadow:0 8px 24px rgba(24,42,78,.06);
  }
  *{box-sizing:border-box}
  body{margin:0;padding:64px 16px 40px;
    background:linear-gradient(135deg,#edf4fc,#dfeaf7);
    font-family:Arial,Helvetica,sans-serif;color:var(--text);min-height:100vh}
  button,input,select,textarea{font:inherit}
  button{cursor:pointer}

  .page{width:100%;max-width:1100px;margin:0 auto}

  .band{
    background:linear-gradient(120deg,#102949,#245d9c);color:#fff;
    border-radius:16px;padding:22px 28px;margin-bottom:20px;
    box-shadow:0 18px 50px #16345417;display:flex;justify-content:space-between;
    align-items:center;gap:16px;flex-wrap:wrap;border-top:5px solid #58a4ff;
  }
  .band-left{display:flex;align-items:center;gap:14px}
  .band-logo{width:48px;height:48px;border-radius:50%;background:#fff;display:grid;place-items:center;
    overflow:hidden;color:var(--navy);font-weight:900;font-size:18px;border:3px solid #d8e8ff;flex:0 0 48px}
  .band-logo img{width:100%;height:100%;object-fit:contain}
  .band h1{margin:0;font-size:19px;letter-spacing:.3px;text-transform:uppercase}
  .band p{margin:4px 0 0;font-size:11px;color:#cfdcf5}
  .band-user{display:flex;align-items:center;gap:10px;font-size:11px;color:#cfdcf5;
    background:#ffffff14;border:1px solid #ffffff36;padding:7px 12px;border-radius:20px}
  .band-user strong{color:#fff}

  .toolbar{display:flex;justify-content:space-between;gap:12px;align-items:center;
    flex-wrap:wrap;margin-bottom:16px}
  .toolbar-left{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
  .field,.pick{border:1px solid var(--line);border-radius:9px;padding:10px 12px;
    background:#fff;color:var(--text);font-size:12px;outline:none}
  .field{min-width:230px}
  .field:focus,.pick:focus{border-color:var(--blue)}

  .btn{border:0;border-radius:9px;padding:11px 15px;background:var(--blue);color:#fff;
    font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:7px}
  .btn:hover{filter:brightness(.96)}
  .btn.secondary{background:#eef2fb;color:#34415c}
  .btn.outline{background:#fff;color:#34415c;border:1px solid var(--line)}
  .btn.danger{background:#fff0f1;color:var(--red)}
  .btn.green{background:#e6f7f0;color:#16835f}
  .btn.warn{background:#fff2dd;color:#a86414}
  .btn:disabled{opacity:.5;cursor:not-allowed}

  .stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}
  .stat{background:#fff;border:1px solid var(--line);border-radius:13px;padding:16px 18px;
    box-shadow:var(--shadow);position:relative;overflow:hidden}
  .stat::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--blue)}
  .stat.green::before{background:var(--green)}
  .stat.red::before{background:var(--red)}
  .stat.orange::before{background:var(--orange)}
  .stat small{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.8px;
    color:var(--muted);font-weight:800;margin-bottom:8px}
  .stat strong{font-size:24px;color:var(--navy);font-weight:800}

  .card{background:#fff;border:1px solid var(--line);border-radius:13px;
    box-shadow:var(--shadow);overflow:hidden}
  .card-head{display:flex;justify-content:space-between;align-items:center;
    padding:18px 22px;border-bottom:1px solid var(--line);gap:12px;flex-wrap:wrap}
  .card-head h3{margin:0;font-size:14px}
  .card-head .count{padding:4px 9px;border-radius:20px;background:#edf2ff;color:#3b5cc1;
    font-size:10px;font-weight:800}

  .table-wrap{overflow-x:auto}
  table{width:100%;border-collapse:collapse;white-space:nowrap}
  th{text-align:left;background:#fafbfe;color:#7a8498;font-size:10px;
    text-transform:uppercase;letter-spacing:.6px;padding:13px 18px;
    border-bottom:1px solid var(--line)}
  td{padding:12px 18px;border-bottom:1px solid #f0f2f7;font-size:12px}
  tbody tr:last-child td{border-bottom:0}

  .person{display:flex;align-items:center;gap:10px}
  .mini-avatar{width:32px;height:32px;display:grid;place-items:center;border-radius:10px;
    background:#edf2ff;color:#3859b7;font-size:10px;font-weight:700}
  .person strong{display:block;font-size:12px}
  .person small{display:block;color:var(--muted);font-size:10px;margin-top:4px}

  .status-seg{display:inline-flex;background:#f3f6fd;border-radius:9px;padding:3px;gap:2px}
  .status-seg button{border:0;background:transparent;padding:7px 12px;border-radius:7px;
    font-size:11px;font-weight:800;color:#54637d;cursor:pointer;transition:.15s}
  .status-seg button:hover{background:#e8eefb}
  .status-seg button[data-val="Present"].active{background:#14805e;color:#fff}
  .status-seg button[data-val="Late"].active{background:#d88922;color:#fff}
  .status-seg button[data-val="Absent"].active{background:#d64545;color:#fff}
  .status-seg button:disabled{cursor:not-allowed;opacity:.6}

  .pill{display:inline-block;padding:5px 8px;border-radius:20px;font-size:10px;font-weight:700}
  .pill.green{background:#e6f7f0;color:#16835f}
  .pill.orange{background:#fff2dd;color:#aa6c14}
  .pill.red{background:#ffeaec;color:#bd3b48}
  .pill.blue{background:#edf2ff;color:#3b5cc1}

  .empty{padding:40px 20px;text-align:center;color:var(--muted);font-size:13px}

  .save-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;
    padding:16px 22px;background:#f8faff;border-top:1px solid var(--line);flex-wrap:wrap}
  .save-bar .note{font-size:11px;color:var(--muted)}

  @media (max-width:850px){
    .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  }
  @media (max-width:650px){
    body{padding:64px 8px 24px}
    .band{padding:18px 20px}
    .band h1{font-size:15px}
    .field,.pick{min-width:0;width:100%}
    .toolbar{flex-direction:column;align-items:stretch}
    .toolbar-left{width:100%}
    .stats{grid-template-columns:1fr}
  }
</style>
</head>
<body>

<div class="page">

  <div class="band">
    <div class="band-left">
      <div class="band-logo" id="bandLogo">DS</div>
      <div>
        <h1 id="bandSchool">Attendance</h1>
        <p id="bandSub">Daily register — mark Present, Late, or Absent for a class</p>
      </div>
    </div>
    <div class="band-user">
      Signed in as <strong id="bandUser">—</strong>
    </div>
  </div>

  <div class="toolbar">
    <div class="toolbar-left">
      <select class="pick" id="classSelect"></select>
      <input class="pick" type="date" id="dateSelect">
    </div>
    <div class="toolbar-left" id="bulkActions">
      <button class="btn secondary" id="markAllPresent">✓ Mark all Present</button>
      <button class="btn secondary" id="clearAll">Clear day</button>
    </div>
  </div>

  <div class="stats">
    <div class="stat green"><small>Present</small><strong id="kPresent">0</strong></div>
    <div class="stat orange"><small>Late</small><strong id="kLate">0</strong></div>
    <div class="stat red"><small>Absent</small><strong id="kAbsent">0</strong></div>
    <div class="stat"><small>Attendance rate</small><strong id="kRate">0%</strong></div>
  </div>

  <div class="card">
    <div class="card-head">
      <h3>Register <span class="count" id="count">0</span></h3>
      <span class="pill blue" id="statusPill">Not saved</span>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th style="width:56px">#</th>
            <th>Student</th>
            <th>ID</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <div class="save-bar">
      <div class="note" id="saveNote">Choose a class and date to begin.</div>
      <div id="saveBtnWrap">
        <button class="btn" id="saveBtn" disabled>💾 Save attendance</button>
      </div>
    </div>
  </div>

</div>

<script src="educore-shared.js?v=13"></script>
<script>
(function(){
  'use strict';
  const E = window.EduCore;

  /* ---------- GUARD ---------- */
  const user = E.requirePerm('attendance', 'Attendance');
  if(!user) return;

  /* ---------- SUB-FEATURE PERMISSIONS ---------- */
  const canSave     = E.can('attendance.save');
  const canClear    = E.can('attendance.clear_day');
  const canMarkAll  = E.can('attendance.mark_all');

  /* ---------- HEADER ---------- */
  function paintHeader(){
    const settings = E.readStore(E.STORE_KEYS.settings, {}) || {};
    const name = settings.name || 'EduCore High School';
    if(settings.logo){
      document.getElementById('bandLogo').innerHTML = `<img src="${settings.logo}" alt="">`;
    } else {
      document.getElementById('bandLogo').textContent =
        name.split(/\s+/).filter(Boolean).slice(0,2).map(w => w[0]).join('').toUpperCase() || 'EC';
    }
    document.getElementById('bandSchool').textContent = name;
    document.getElementById('bandSub').textContent = 'Daily register — mark Present, Late, or Absent for a class';
    document.getElementById('bandUser').textContent = user.name || user.username;
  }

  /* ---------- STATE ---------- */
  const state = {
    class: '',
    date: E.todayISO(),
    marks: {},
    dirty: false
  };

  /* ---------- CLASS OPTIONS ---------- */
  function fillClasses(){
    const sel = document.getElementById('classSelect');
    const classes = E.visibleClassNamesFor(user);
    if(!classes.length){
      sel.innerHTML = '<option value="">No classes available</option>';
      sel.disabled = true;
      return;
    }
    sel.disabled = false;
    sel.innerHTML = classes.map(c => `<option value="${E.esc(c)}">${E.esc(c)}</option>`).join('');
    const saved = sessionStorage.getItem('educoreAttendanceClass');
    state.class = (saved && classes.includes(saved)) ? saved : classes[0];
    sel.value = state.class;
  }

  /* ---------- LOAD MARKS ---------- */
  function loadMarks(){
    const attendance = E.readStore(E.STORE_KEYS.attendance, {}) || {};
    const key = state.date + '|' + state.class;
    const saved = attendance[key] || null;

    state.marks = {};
    const students = (E.readStore(E.STORE_KEYS.students, []) || [])
      .filter(s => s.class === state.class)
      .sort((a,b) => a.name.localeCompare(b.name));

    students.forEach(s => {
      state.marks[s.id] = saved?.[s.id] || 'Present';
    });
    state.dirty = false;
    updateSaveStatus(saved ? 'saved' : 'new');
  }

  /* ---------- RENDER REGISTER ---------- */
  function paintRegister(){
    const students = (E.readStore(E.STORE_KEYS.students, []) || [])
      .filter(s => s.class === state.class)
      .sort((a,b) => a.name.localeCompare(b.name));

    const tb = document.getElementById('tbody');
    if(!students.length){
      tb.innerHTML = '<tr><td colspan="4" class="empty">No students enrolled in this class.</td></tr>';
      document.getElementById('count').textContent = '0';
      updateStats();
      return;
    }

    tb.innerHTML = students.map((s, i) => {
      const cur = state.marks[s.id] || 'Present';
      const disabled = canSave ? '' : 'disabled';
      return `<tr>
        <td style="color:var(--muted)">${i + 1}</td>
        <td>
          <div class="person">
            <div class="mini-avatar">${E.initials(s.name)}</div>
            <div><strong>${E.esc(s.name)}</strong><small>${E.esc(s.gender||'—')}</small></div>
          </div>
        </td>
        <td style="font-family:monospace;font-size:11px;color:var(--muted)">${E.esc(s.id)}</td>
        <td>
          <div class="status-seg" data-id="${E.esc(s.id)}">
            <button ${disabled} data-val="Present" class="${cur === 'Present' ? 'active' : ''}">Present</button>
            <button ${disabled} data-val="Late"    class="${cur === 'Late'    ? 'active' : ''}">Late</button>
            <button ${disabled} data-val="Absent"  class="${cur === 'Absent'  ? 'active' : ''}">Absent</button>
          </div>
        </td>
      </tr>`;
    }).join('');

    document.getElementById('count').textContent = students.length + ' student' + (students.length === 1 ? '' : 's');
    updateStats();
  }

  /* ---------- STATS ---------- */
  function updateStats(){
    const vals = Object.values(state.marks);
    let p = 0, l = 0, a = 0;
    vals.forEach(v => { if(v === 'Present') p++; else if(v === 'Late') l++; else a++; });
    const total = p + l + a;
    const rate = total ? Math.round((p + l) / total * 100) : 0;
    document.getElementById('kPresent').textContent = p;
    document.getElementById('kLate').textContent    = l;
    document.getElementById('kAbsent').textContent  = a;
    document.getElementById('kRate').textContent    = rate + '%';
  }

  /* ---------- SAVE STATUS ---------- */
  function updateSaveStatus(kind){
    const pill = document.getElementById('statusPill');
    const note = document.getElementById('saveNote');
    const btn  = document.getElementById('saveBtn');
    if(!canSave){
      pill.textContent = 'View only';
      pill.className = 'pill orange';
      note.textContent = 'You have view-only access to attendance. Saving is disabled for your account.';
      btn.disabled = true;
      return;
    }
    if(kind === 'saved'){
      pill.textContent = 'Saved';
      pill.className = 'pill green';
      note.textContent = `Attendance saved for ${state.class} · ${state.date}.`;
      btn.disabled = true;
    } else if(kind === 'dirty'){
      pill.textContent = 'Unsaved changes';
      pill.className = 'pill orange';
      note.textContent = 'You have unsaved changes. Click Save attendance to commit.';
      btn.disabled = false;
    } else {
      pill.textContent = 'Not saved';
      pill.className = 'pill blue';
      note.textContent = 'No attendance recorded for this class and date yet.';
      btn.disabled = false;
    }
  }

  /* ---------- SEGMENTED STATUS CLICK ---------- */
  document.getElementById('tbody').addEventListener('click', e => {
    if(!canSave) return;
    const btn = e.target.closest('.status-seg button');
    if(!btn || btn.disabled) return;
    const seg = btn.closest('.status-seg');
    const id = seg.dataset.id;
    const val = btn.dataset.val;
    if(state.marks[id] === val) return;
    state.marks[id] = val;
    seg.querySelectorAll('button').forEach(b => b.classList.toggle('active', b === btn));
    state.dirty = true;
    updateStats();
    updateSaveStatus('dirty');
  });

  /* ---------- BULK ACTIONS ---------- */
  document.getElementById('markAllPresent')?.addEventListener('click', () => {
    if(!canMarkAll){ E.toast("You don't have permission to bulk-mark attendance."); return; }
    if(!Object.keys(state.marks).length) return;
    if(!confirm('Mark every student Present?')) return;
    Object.keys(state.marks).forEach(id => state.marks[id] = 'Present');
    state.dirty = true;
    paintRegister();
    updateSaveStatus('dirty');
  });

  document.getElementById('clearAll')?.addEventListener('click', () => {
    if(!canClear){ E.toast("You don't have permission to clear attendance."); return; }
    if(!Object.keys(state.marks).length) return;
    if(!confirm('Clear this day\'s attendance for this class?')) return;
    const attendance = E.readStore(E.STORE_KEYS.attendance, {}) || {};
    const key = state.date + '|' + state.class;
    delete attendance[key];
    E.writeStore(E.STORE_KEYS.attendance, attendance);
    E.audit('delete', `Attendance ${state.class} · ${state.date}`, '', 'cleared');
    loadMarks();
    paintRegister();
    updateSaveStatus('new');
    E.toast('Attendance cleared.');
  });

  /* ---------- SAVE ---------- */
  document.getElementById('saveBtn').addEventListener('click', () => {
    if(!canSave){ E.toast("You don't have permission to save attendance."); return; }
    if(!state.class || !state.date){ E.toast('Pick a class and date first.'); return; }
    const attendance = E.readStore(E.STORE_KEYS.attendance, {}) || {};
    const key = state.date + '|' + state.class;

    const before = attendance[key] || null;
    attendance[key] = { ...state.marks };
    E.writeStore(E.STORE_KEYS.attendance, attendance);

    const summary = (() => {
      let p = 0, l = 0, a = 0;
      Object.values(state.marks).forEach(v => { if(v === 'Present') p++; else if(v === 'Late') l++; else a++; });
      return `P:${p} L:${l} A:${a}`;
    })();
    E.audit(before ? 'update' : 'create', `Attendance ${state.class} · ${state.date}`, '', summary);

    state.dirty = false;
    updateSaveStatus('saved');
    E.toast(`Attendance saved · ${state.class} · ${state.date}`);
  });

  /* ---------- SELECTORS ---------- */
  document.getElementById('classSelect').addEventListener('change', e => {
    if(state.dirty && !confirm('You have unsaved attendance. Discard and switch class?')){
      e.target.value = state.class;
      return;
    }
    state.class = e.target.value;
    sessionStorage.setItem('educoreAttendanceClass', state.class);
    loadMarks();
    paintRegister();
  });

  document.getElementById('dateSelect').addEventListener('change', e => {
    if(state.dirty && !confirm('You have unsaved attendance. Discard and switch date?')){
      e.target.value = state.date;
      return;
    }
    state.date = e.target.value;
    loadMarks();
    paintRegister();
  });

  /* ---------- INIT ---------- */
  paintHeader();
  fillClasses();
  document.getElementById('dateSelect').value = state.date;
  loadMarks();
  paintRegister();

  /* Hide bulk actions the user can't use */
  if(!canMarkAll){
    const b = document.getElementById('markAllPresent');
    if(b) b.style.display = 'none';
  }
  if(!canClear){
    const b = document.getElementById('clearAll');
    if(b) b.style.display = 'none';
  }
  if(!canSave){
    document.getElementById('saveBtnWrap').style.display = 'none';
  }
})();
</script>
</body>
</html>
