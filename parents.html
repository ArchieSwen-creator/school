<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parents | EduCore</title>
<style>
  :root{
    --navy:#12315a;--navy2:#14213d;--blue:#3987ee;--pale:#eef5ff;--border:#d8e4f2;
    --text:#23354d;--muted:#73849a;--green:#14805e;--orange:#d88922;--red:#d64545;
    --gold:#c99a2e;--gold2:#fff4d6;--bg:#f5f7fb;--line:#e8ebf2;--white:#fff;
    --shadow:0 8px 24px rgba(24,42,78,.06);
  }
  *{box-sizing:border-box}
  body{margin:0;padding:64px 16px 40px;
    background:linear-gradient(135deg,#edf4fc,#dfeaf7);
    font-family:Arial,Helvetica,sans-serif;color:var(--text);min-height:100vh}
  button,input,select,textarea{font:inherit}
  button{cursor:pointer}
  .page{width:100%;max-width:1200px;margin:0 auto}

  .band{
    background:linear-gradient(120deg,#102949,#245d9c);color:#fff;
    border-radius:16px;padding:22px 28px;margin-bottom:20px;
    box-shadow:0 18px 50px #16345417;display:flex;justify-content:space-between;
    align-items:center;gap:16px;flex-wrap:wrap;border-top:5px solid #58a4ff;
  }
  .band-left{display:flex;align-items:center;gap:14px}
  .band-logo{width:48px;height:48px;border-radius:50%;background:#fff;display:grid;place-items:center;
    overflow:hidden;color:var(--navy);font-weight:900;font-size:18px;border:3px solid #d8e8ff;flex:0 0 48px}
  .band-logo img{width:100%;height:100%;object-fit:contain}
  .band h1{margin:0;font-size:19px;letter-spacing:.3px;text-transform:uppercase}
  .band p{margin:4px 0 0;font-size:11px;color:#cfdcf5}
  .band-user{display:flex;align-items:center;gap:10px;font-size:11px;color:#cfdcf5;
    background:#ffffff14;border:1px solid #ffffff36;padding:7px 12px;border-radius:20px}
  .band-user strong{color:#fff}

  .stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}
  .stat{background:#fff;border:1px solid var(--line);border-radius:13px;padding:16px 18px;
    box-shadow:var(--shadow);position:relative;overflow:hidden}
  .stat::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--blue)}
  .stat.green::before{background:var(--green)}
  .stat.orange::before{background:var(--orange)}
  .stat.red::before{background:var(--red)}
  .stat small{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.8px;
    color:var(--muted);font-weight:800;margin-bottom:8px}
  .stat strong{font-size:22px;color:var(--navy);font-weight:800}

  .toolbar{display:flex;justify-content:space-between;gap:12px;align-items:center;
    flex-wrap:wrap;margin-bottom:16px}
  .toolbar-left{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
  .field,.pick{border:1px solid var(--line);border-radius:9px;padding:10px 12px;
    background:#fff;color:var(--text);font-size:12px;outline:none}
  .field{min-width:230px}
  .field:focus,.pick:focus{border-color:var(--blue)}

  .btn{border:0;border-radius:9px;padding:11px 15px;background:var(--blue);color:#fff;
    font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:7px}
  .btn:hover{filter:brightness(.96)}
  .btn.secondary{background:#eef2fb;color:#34415c}
  .btn.outline{background:#fff;color:#34415c;border:1px solid var(--line)}
  .btn.danger{background:#fff0f1;color:var(--red)}
  .btn.green{background:#e6f7f0;color:#16835f}
  .btn:disabled{opacity:.5;cursor:not-allowed}

  .card{background:#fff;border:1px solid var(--line);border-radius:13px;
    box-shadow:var(--shadow);overflow:hidden}
  .card-head{display:flex;justify-content:space-between;align-items:center;
    padding:18px 22px;border-bottom:1px solid var(--line);gap:12px;flex-wrap:wrap}
  .card-head h3{margin:0;font-size:14px}
  .card-head .count{padding:4px 9px;border-radius:20px;background:#edf2ff;color:#3b5cc1;
    font-size:10px;font-weight:800}

  .table-wrap{overflow-x:auto}
  table{width:100%;border-collapse:collapse;white-space:nowrap}
  th{text-align:left;background:#fafbfe;color:#7a8498;font-size:10px;
    text-transform:uppercase;letter-spacing:.6px;padding:13px 18px;
    border-bottom:1px solid var(--line)}
  td{padding:13px 18px;border-bottom:1px solid #f0f2f7;font-size:12px}
  tbody tr:last-child td{border-bottom:0}

  .person{display:flex;align-items:center;gap:10px}
  .mini-avatar{width:32px;height:32px;display:grid;place-items:center;border-radius:10px;
    background:#edf2ff;color:#3859b7;font-size:10px;font-weight:700;overflow:hidden}
  .mini-avatar img{width:100%;height:100%;object-fit:cover}
  .person strong{display:block;font-size:12px}
  .person small{display:block;color:var(--muted);font-size:10px;margin-top:4px}

  .pill{display:inline-block;padding:5px 8px;border-radius:20px;font-size:10px;font-weight:700}
  .pill.blue{background:#edf2ff;color:#3b5cc1}
  .pill.green{background:#e6f7f0;color:#16835f}
  .pill.grey{background:#eef1f6;color:#59647c}

  .chips-cell{white-space:normal;max-width:340px}
  .row-actions{display:flex;gap:5px;flex-wrap:wrap}
  .row-actions .btn{padding:8px 10px;font-size:11px}

  .empty{padding:60px 20px;text-align:center;color:var(--muted);font-size:13px}
  .empty .icon{font-size:48px;margin-bottom:14px;opacity:.5;display:block}

  /* View modal */
  .view-head{
    display:flex;align-items:center;gap:16px;
    padding-bottom:16px;border-bottom:1px solid #e8ebf2;margin-bottom:6px;
  }
  .view-avatar{
    width:72px;height:72px;border-radius:18px;background:#edf2ff;
    color:#3859b7;display:grid;place-items:center;font-weight:800;font-size:20px;
    overflow:hidden;flex:0 0 72px;border:2px solid #d8e8ff;
  }
  .view-avatar img{width:100%;height:100%;object-fit:cover}
  .view-name{margin:0;font-size:18px;color:#14213d}
  .view-sub{font-size:12px;color:#73849a;margin-top:4px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .view-pill{
    display:inline-flex;align-items:center;gap:5px;padding:3px 9px;
    border-radius:20px;font-size:10px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;
  }
  .view-pill.green{background:#e6f7f0;color:#16835f}
  .view-pill.orange{background:#fff2dd;color:#a86414}
  .view-pill.red{background:#ffeaec;color:#bd3b48}
  .view-pill.blue{background:#edf2ff;color:#3b5cc1}
  .view-pill.grey{background:#eef1f6;color:#59647c}

  .view-section{margin-top:16px}
  .view-section-head{
    font-size:10px;font-weight:800;color:#73849a;
    text-transform:uppercase;letter-spacing:1px;
    padding-bottom:6px;border-bottom:1px solid #e8ebf2;margin-bottom:8px;
  }
  .view-row{
    display:flex;justify-content:space-between;gap:14px;
    padding:7px 0;font-size:12.5px;border-bottom:1px dotted #f0f2f7;
  }
  .view-row:last-child{border-bottom:0}
  .view-row .label{
    color:#73849a;font-weight:700;font-size:10px;
    text-transform:uppercase;letter-spacing:.5px;flex:0 0 42%;
  }
  .view-row .value{
    color:#14213d;text-align:right;word-break:break-word;font-weight:700;
  }
  .view-child-row{
    display:flex;justify-content:space-between;gap:10px;
    padding:9px 12px;background:#f8faff;border:1px solid #e8ebf2;border-radius:8px;
    margin-bottom:6px;font-size:12.5px;
  }
  .view-child-row:last-child{margin-bottom:0}
  .view-child-row .who strong{color:#14213d;font-weight:700;display:block}
  .view-child-row .who small{color:#73849a;font-size:10.5px;display:block;margin-top:2px}
  .view-child-row .cls-pill{
    display:inline-flex;align-items:center;
    background:#edf2ff;color:#3b5cc1;
    padding:3px 9px;border-radius:12px;font-size:10px;font-weight:800;
    white-space:nowrap;align-self:center;
  }

  /* Edit modal — profile block */
  .personal-block-label{
    font-size:12px;color:#34415c;letter-spacing:.5px;text-transform:uppercase;
    padding-top:6px;border-top:1px dashed #e8ebf2;margin-top:6px;
  }
  .photo-field{display:flex;gap:14px;align-items:flex-start;margin-top:6px}
  .photo-preview{
    width:88px;height:88px;flex:0 0 88px;border-radius:14px;
    border:2px dashed #c9d1e0;background:#f8faff;
    display:grid;place-items:center;overflow:hidden;
    color:#7a8498;font-size:11px;text-align:center;position:relative;
    font-weight:800;
  }
  .photo-preview img{width:100%;height:100%;object-fit:cover}
  .photo-actions{display:flex;flex-direction:column;gap:6px;flex:1}
  .photo-actions .help{font-size:10.5px;color:#73849a;line-height:1.5}

  @media (max-width:850px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
  @media (max-width:650px){
    body{padding:64px 8px 24px}
    .band{padding:18px 20px}
    .band h1{font-size:15px}
    .field,.pick{min-width:0;width:100%}
    .toolbar{flex-direction:column;align-items:stretch}
    .toolbar-left{width:100%}
    .stats{grid-template-columns:1fr}
  }
</style>
</head>
<body>

<div class="page">

  <div class="band">
    <div class="band-left">
      <div class="band-logo" id="bandLogo">EC</div>
      <div>
        <h1 id="bandSchool">Parents</h1>
        <p id="bandSub">Parent / guardian registry — feeds the student guardian dropdown</p>
      </div>
    </div>
    <div class="band-user">Signed in as <strong id="bandUser">—</strong></div>
  </div>

  <div class="stats">
    <div class="stat"><small>Total parents</small><strong id="kTotal">0</strong></div>
    <div class="stat green"><small>With children linked</small><strong id="kLinked">0</strong></div>
    <div class="stat orange"><small>Missing phone</small><strong id="kNoPhone">0</strong></div>
    <div class="stat red"><small>Missing email</small><strong id="kNoEmail">0</strong></div>
  </div>

  <div class="toolbar">
    <div class="toolbar-left">
      <input class="field" id="search" placeholder="Search name, phone, email, occupation...">
      <select class="pick" id="linkFilter">
        <option value="">All parents</option>
        <option value="linked">With linked students</option>
        <option value="unlinked">Without linked students</option>
      </select>
    </div>
    <div class="toolbar-left">
      <button class="btn secondary" id="exportBtn">↓ Export CSV</button>
      <button class="btn" id="addBtn">＋ Add parent</button>
    </div>
  </div>

  <div class="card">
    <div class="card-head">
      <h3>Parent registry <span class="count" id="count">0</span></h3>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Parent</th>
            <th>Relationship</th>
            <th>Contact</th>
            <th>Occupation</th>
            <th>Linked students</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>

</div>

<script src="educore-shared.js?v=15"></script>
<script>
(function(){
  'use strict';
  const E = window.EduCore;

  const user = E.requirePerm('parents', 'Parents');
  if(!user) return;

  const canAdd    = E.can('parents.add');
  const canEdit   = E.can('parents.edit');
  const canDelete = E.can('parents.delete');
  const canExport = E.can('parents.export');

  function paintHeader(){
    const settings = E.readStore(E.STORE_KEYS.settings, {}) || {};
    const name = settings.name || 'EduCore High School';
    if(settings.logo){
      document.getElementById('bandLogo').innerHTML = `<img src="${settings.logo}" alt="">`;
    } else {
      document.getElementById('bandLogo').textContent =
        name.split(/\s+/).filter(Boolean).slice(0,2).map(w => w[0]).join('').toUpperCase() || 'EC';
    }
    document.getElementById('bandSchool').textContent = name;
    document.getElementById('bandUser').textContent = user.name || user.username;
  }

  function studentsForParent(parentName){
    const needle = String(parentName || '').trim().toLowerCase();
    if(!needle) return [];
    return (E.readStore(E.STORE_KEYS.students, []) || [])
      .filter(s => String(s.guardian || '').trim().toLowerCase() === needle);
  }

  function linkedUserForParent(parent){
    if(!parent) return null;
    const users = E.readStore(E.STORE_KEYS.users, []) || [];
    return users.find(u => u.role === 'Parent' &&
      String(u.name || '').trim().toLowerCase() === String(parent.name || '').trim().toLowerCase()) || null;
  }

  function parentPhoto(parent){
    if(!parent) return '';
    const u = linkedUserForParent(parent);
    if(u && u.photo) return u.photo;
    return '';
  }

  function paintTable(){
    const parents = E.getParents().slice();
    const q = document.getElementById('search').value.toLowerCase();
    const lf = document.getElementById('linkFilter').value;

    const rows = parents.map(p => {
      const kids = studentsForParent(p.name);
      return { parent: p, kids };
    }).filter(({ parent, kids }) => {
      if(q){
        const hay = `${parent.name} ${parent.phone||''} ${parent.email||''} ${parent.occupation||''} ${parent.relationship||''}`.toLowerCase();
        if(!hay.includes(q)) return false;
      }
      if(lf === 'linked' && kids.length === 0) return false;
      if(lf === 'unlinked' && kids.length > 0) return false;
      return true;
    }).sort((a,b) => a.parent.name.localeCompare(b.parent.name));

    document.getElementById('kTotal').textContent = parents.length;
    document.getElementById('kLinked').textContent = parents.filter(p => studentsForParent(p.name).length).length;
    document.getElementById('kNoPhone').textContent = parents.filter(p => !p.phone).length;
    document.getElementById('kNoEmail').textContent = parents.filter(p => !p.email).length;

    const tb = document.getElementById('tbody');
    tb.innerHTML = rows.map(({ parent: p, kids }) => {
      const contact = [
        p.phone ? `📞 ${E.esc(p.phone)}` : '',
        p.email ? `✉ ${E.esc(p.email)}` : ''
      ].filter(Boolean).join(' · ') || '<span style="color:#c5cee0">—</span>';

      const kidChips = kids.length
        ? kids.map(k => `<span class="pill blue">${E.esc(k.name)} · ${E.esc(k.class)}</span>`).join(' ')
        : '<span class="pill grey">No students linked</span>';

      const photo = parentPhoto(p);
      const avatar = photo
        ? `<img src="${E.esc(photo)}" alt="">`
        : E.initials(p.name);

      return `<tr>
        <td>
          <div class="person">
            <div class="mini-avatar">${avatar}</div>
            <div>
              <strong>${E.esc(p.name)}</strong>
              <small>${E.esc(p.address || p.id)}</small>
            </div>
          </div>
        </td>
        <td>${E.esc(p.relationship || '—')}</td>
        <td>${contact}</td>
        <td>${E.esc(p.occupation || '—')}</td>
        <td class="chips-cell">${kidChips}</td>
        <td>
          <div class="row-actions">
            <button class="btn outline" data-view="${E.esc(p.id)}">View</button>
            ${canEdit ? `<button class="btn secondary" data-edit="${E.esc(p.id)}">Edit</button>` : ''}
            ${canDelete ? `<button class="btn danger" data-delete="${E.esc(p.id)}">Delete</button>` : ''}
          </div>
        </td>
      </tr>`;
    }).join('') || `<tr><td colspan="6" class="empty">
      <span class="icon">👪</span>
      No parents match your filters. Click <strong>Add parent</strong> to start the registry.
    </td></tr>`;

    document.getElementById('count').textContent = rows.length;
  }

  /* ============================================================
     VIEW MODAL — parent basic information
     ============================================================ */
  function openViewModal(parentId){
    const parents = E.getParents();
    const p = parents.find(x => x.id === parentId);
    if(!p) return;

    const linkedUser = linkedUserForParent(p);
    const photo = parentPhoto(p);
    const kids = studentsForParent(p.name);

    function renderSection(title, rows){
      const filled = rows.filter(([, v]) => v && String(v).trim() && String(v).trim() !== '—');
      if(!filled.length) return '';
      return `<div class="view-section">
        <div class="view-section-head">${E.esc(title)}</div>
        ${filled.map(([label, value]) => `
          <div class="view-row">
            <span class="label">${E.esc(label)}</span>
            <strong class="value">${E.esc(String(value))}</strong>
          </div>`).join('')}
      </div>`;
    }

    const personalHTML = renderSection('Personal & identity', [
      ['Full name', p.name],
      ['Registry ID', p.id],
      ['Relationship', p.relationship || '—'],
      ['Nationality', linkedUser?.nationality || ''],
      ['County of origin', linkedUser?.countyOfOrigin || ''],
      ['Ethnic group', linkedUser?.ethnicGroup || ''],
      ['Religion', linkedUser?.religion || ''],
      ['Qualification', linkedUser?.qualification || '']
    ]);

    const contactHTML = renderSection('Contact & registry', [
      ['Phone', p.phone || '—'],
      ['Email', p.email || '—'],
      ['Address', p.address || '—'],
      ['Occupation', p.occupation || '—']
    ]);

    let childrenHTML = '';
    if(kids.length){
      childrenHTML = `<div class="view-section">
        <div class="view-section-head">Linked children (${kids.length})</div>
        ${kids.map(k => `
          <div class="view-child-row">
            <div class="who">
              <strong>${E.esc(k.name)}</strong>
              <small>${E.esc(k.id)} · ${E.esc(k.status || 'Active')}</small>
            </div>
            <span class="cls-pill">${E.esc(k.class)}</span>
          </div>`).join('')}
      </div>`;
    }

    const accountHTML = linkedUser
      ? renderSection('Account', [
          ['Username', linkedUser.username],
          ['Account status', linkedUser.active ? 'Active' : 'Disabled'],
          ['Public verify', linkedUser.showInPublicVerify ? '✓ Shown' : 'Hidden'],
          ['Last login', linkedUser.lastLogin ? E.fmtDateTime(linkedUser.lastLogin) : 'Never']
        ])
      : '';

    const avatarHTML = photo
      ? `<img src="${E.esc(photo)}" alt="">`
      : E.initials(p.name);

    const relPillClass = p.relationship === 'Father' ? 'blue'
                       : p.relationship === 'Mother' ? 'green'
                       : p.relationship === 'Guardian' ? 'orange'
                       : 'grey';

    const html = `
      <div class="full view-head">
        <div class="view-avatar">${avatarHTML}</div>
        <div>
          <h3 class="view-name">${E.esc(p.name)}</h3>
          <div class="view-sub">
            ${p.relationship ? `<span class="view-pill ${relPillClass}">${E.esc(p.relationship)}</span>` : ''}
            <span>${kids.length} ${kids.length === 1 ? 'child' : 'children'}</span>
            <span style="color:#c5cee0">·</span>
            <span>${E.esc(p.id)}</span>
          </div>
        </div>
      </div>

      ${personalHTML}
      ${contactHTML}
      ${childrenHTML}
      ${accountHTML}
    `;

    E.openModal('Parent profile', html, 'Edit parent', () => {
      E.closeModal();
      const target = E.parentById(p.id);
      if(target) openParentModal(target.id);
    }, true);
  }

  /* ============================================================
     ADD / EDIT PARENT (extended with profile fields)
     ============================================================ */
  function openParentModal(existingId){
    const existing = existingId ? E.parentById(existingId) : null;
    const isNew = !existing;
    const p = existing || { name:'', phone:'', email:'', address:'', occupation:'', relationship:'', notes:'' };

    const linkedUser = existing ? linkedUserForParent(existing) : null;
    const profile = {
      photo: linkedUser?.photo || '',
      nationality: linkedUser?.nationality || '',
      countyOfOrigin: linkedUser?.countyOfOrigin || '',
      ethnicGroup: linkedUser?.ethnicGroup || '',
      religion: linkedUser?.religion || '',
      qualification: linkedUser?.qualification || ''
    };

    const photoPreviewHTML = profile.photo
      ? `<img src="${E.esc(profile.photo)}" alt="">`
      : (p.name ? E.initials(p.name) : 'No photo');

    const relOptions = ['Father','Mother','Guardian','Grandparent','Uncle','Aunt','Sibling','Other'];
    const currentRel = p.relationship || '';

    const html = `
      <div class="full"><label>Parent / guardian name <span style="color:#bd3b48">*</span></label>
        <input name="name" id="parentNameInput" required value="${E.esc(p.name||'')}"
          placeholder="e.g. Mr. & Mrs. Johnson">
        <small style="color:var(--muted);font-size:10px;display:block;margin-top:4px">
          This exact name appears in the student's <strong>Guardian</strong> dropdown.
        </small>
      </div>
      <div><label>Relationship</label>
        <select name="relationship">
          <option value="">— Pick —</option>
          ${relOptions.map(r => `<option ${currentRel === r ? 'selected' : ''}>${r}</option>`).join('')}
        </select>
      </div>
      <div><label>Phone</label>
        <input name="phone" value="${E.esc(p.phone||'')}" placeholder="e.g. +231 77 000 0000">
      </div>
      <div><label>Email</label>
        <input name="email" type="email" value="${E.esc(p.email||'')}">
      </div>
      <div><label>Occupation</label>
        <input name="occupation" value="${E.esc(p.occupation||'')}">
      </div>
      <div class="full"><label>Address</label>
        <input name="address" value="${E.esc(p.address||'')}">
      </div>
      <div class="full"><label>Notes</label>
        <textarea name="notes" rows="3" placeholder="Anything the school should know...">${E.esc(p.notes||'')}</textarea>
      </div>

      <div class="full personal-block-label">Personal information</div>

      <div class="full">
        <label>Photo</label>
        <div class="photo-field">
          <div class="photo-preview" id="parentPhotoPreview">${photoPreviewHTML}</div>
          <div class="photo-actions">
            <input type="file" id="parentPhotoInput" accept="image/*" style="display:none">
            <input type="hidden" name="photo" id="parentPhotoHidden" value="${E.esc(profile.photo)}">
            <button type="button" class="btn secondary" id="parentPhotoPickBtn">📷 Upload photo</button>
            <button type="button" class="btn outline" id="parentPhotoClearBtn"
              ${profile.photo ? '' : 'style="display:none"'}>✕ Remove photo</button>
            <span class="help">Square · max 1 MB · PNG / JPG / WEBP / GIF</span>
          </div>
        </div>
      </div>

      <div>
        <label>Nationality</label>
        <input name="nationality" value="${E.esc(profile.nationality)}" placeholder="e.g. Liberian">
      </div>

      <div>
        <label>County of origin</label>
        <input name="countyOfOrigin" value="${E.esc(profile.countyOfOrigin)}" placeholder="e.g. Montserrado">
      </div>

      <div>
        <label>Ethnic group</label>
        <input name="ethnicGroup" value="${E.esc(profile.ethnicGroup)}" placeholder="e.g. Kpelle">
      </div>

      <div>
        <label>Religion</label>
        <input name="religion" value="${E.esc(profile.religion)}" placeholder="e.g. Christian">
      </div>

      <div class="full">
        <label>Qualification</label>
        <input name="qualification" value="${E.esc(profile.qualification)}"
          placeholder="e.g. BSc Economics">
      </div>`;

    E.openModal(isNew ? 'Add parent / guardian' : `Edit · ${p.name}`, html,
      isNew ? 'Add to registry' : 'Save changes', d => {
        const payload = {
          name: d.name,
          phone: d.phone || '',
          email: d.email || '',
          address: d.address || '',
          occupation: d.occupation || '',
          relationship: d.relationship || '',
          notes: d.notes || ''
        };
        let res;
        let parentRecord;
        if(isNew){
          res = E.addParent(payload);
          if(!res.ok){ E.toast(res.error); return; }
          parentRecord = res.parent;
          E.audit('create', `Parent ${parentRecord.id}`, '', parentRecord.name);
        } else {
          res = E.updateParent(existing.id, payload);
          if(!res.ok){ E.toast(res.error); return; }
          parentRecord = res.parent;
          E.audit('update', `Parent ${existing.id}`, existing.name, parentRecord.name);
        }

        /* Write profile fields to linked parent user account.
           Parents match by NAME, so we pass the (possibly new) name
           inside the patch so updateLinkedUserProfile can find them. */
        const profilePatch = {
          name: parentRecord.name,
          photo: d.photo || '',
          nationality: d.nationality || '',
          countyOfOrigin: d.countyOfOrigin || '',
          ethnicGroup: d.ethnicGroup || '',
          religion: d.religion || '',
          qualification: d.qualification || ''
        };
        const linkRes = E.updateLinkedUserProfile('Parent', null, profilePatch);
        if(!linkRes.ok){
          E.toast(isNew
            ? 'Parent added. Note: no linked user account to store profile fields.'
            : 'Parent saved. Note: no linked user account to store profile fields.');
        } else {
          E.toast(isNew ? 'Parent added to registry.' : 'Parent updated.');
        }

        E.closeModal();
        paintTable();
      }, true);

    /* Photo picker */
    const photoInput  = document.getElementById('parentPhotoInput');
    const photoHidden = document.getElementById('parentPhotoHidden');
    const photoPick   = document.getElementById('parentPhotoPickBtn');
    const photoClear  = document.getElementById('parentPhotoClearBtn');
    const photoPrev   = document.getElementById('parentPhotoPreview');
    const nameInput   = document.getElementById('parentNameInput');

    photoPick?.addEventListener('click', () => photoInput.click());
    photoInput?.addEventListener('change', async () => {
      const file = photoInput.files[0];
      if(!file) return;
      const read = await E.readPhotoFile(file);
      if(!read.ok){ E.toast(read.error); photoInput.value = ''; return; }
      const small = await E.downscalePhoto(read.dataUrl, 256);
      photoHidden.value = small;
      photoPrev.innerHTML = `<img src="${small}" alt="">`;
      photoClear.style.display = '';
    });
    photoClear?.addEventListener('click', () => {
      photoHidden.value = '';
      const n = nameInput.value.trim();
      photoPrev.innerHTML = n ? E.initials(n) : 'No photo';
      photoClear.style.display = 'none';
      photoInput.value = '';
    });
    nameInput?.addEventListener('input', () => {
      if(!photoHidden.value && photoPrev && !photoPrev.querySelector('img')){
        const n = nameInput.value.trim();
        photoPrev.textContent = n ? E.initials(n) : 'No photo';
      }
    });
  }

  function deleteParentConfirm(id){
    const p = E.parentById(id);
    if(!p) return;
    const kids = studentsForParent(p.name);
    if(kids.length){
      alert(
        `Cannot delete "${p.name}" — ${kids.length} student${kids.length === 1 ? ' is' : 's are'} still linked:\n\n` +
        kids.map(k => `• ${k.name} (${k.class} · ${k.id})`).join('\n') +
        `\n\nReassign those students to a different guardian first.`
      );
      return;
    }
    if(!confirm(`Delete parent "${p.name}" from the registry?\n\nThis cannot be undone.`)) return;
    const res = E.deleteParent(id);
    if(!res.ok){ E.toast(res.error || 'Delete failed.'); return; }
    E.audit('delete', `Parent ${id}`, p.name, '');
    paintTable();
    E.toast('Parent removed from registry.');
  }

  function exportCSV(){
    const parents = E.getParents();
    if(!parents.length){ E.toast('Nothing to export.'); return; }
    const rows = [
      ['ID','Name','Relationship','Phone','Email','Occupation','Address','Notes','Linked students'],
      ...parents.map(p => {
        const kids = studentsForParent(p.name).map(k => `${k.name} (${k.id})`).join('; ');
        return [p.id, p.name, p.relationship||'', p.phone||'', p.email||'', p.occupation||'', p.address||'', p.notes||'', kids];
      })
    ];
    const csv = rows.map(r => r.map(v => '"' + String(v ?? '').replace(/"/g,'""') + '"').join(',')).join('\r\n');
    const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = url; a.download = 'parents.csv'; a.click();
    URL.revokeObjectURL(url);
    E.audit('create', 'Parent CSV export', '', `${parents.length} rows`);
    E.toast('Parents exported.');
  }

  document.getElementById('search').addEventListener('input', paintTable);
  document.getElementById('linkFilter').addEventListener('change', paintTable);
  document.getElementById('addBtn').addEventListener('click', () => openParentModal(null));
  document.getElementById('exportBtn').addEventListener('click', exportCSV);

  document.getElementById('tbody').addEventListener('click', e => {
    const view = e.target.closest('[data-view]');
    const edit = e.target.closest('[data-edit]');
    const del  = e.target.closest('[data-delete]');
    if(view) openViewModal(view.dataset.view);
    if(edit) openParentModal(edit.dataset.edit);
    if(del)  deleteParentConfirm(del.dataset.delete);
  });

  paintHeader();
  paintTable();

  if(!canAdd)    document.getElementById('addBtn').style.display = 'none';
  if(!canExport) document.getElementById('exportBtn').style.display = 'none';
})();
</script>
</body>
</html>
