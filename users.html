<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>User Management | EduCore</title>
<style>
  :root{
    --navy:#12315a;--navy2:#14213d;--blue:#3987ee;--pale:#eef5ff;--border:#d8e4f2;
    --text:#23354d;--muted:#73849a;--green:#14805e;--orange:#d88922;--red:#d64545;
    --gold:#c99a2e;--gold2:#fff4d6;--bg:#f5f7fb;--line:#e8ebf2;--white:#fff;
    --shadow:0 8px 24px rgba(24,42,78,.06);
  }
  *{box-sizing:border-box}
  body{margin:0;padding:64px 16px 40px;
    background:linear-gradient(135deg,#edf4fc,#dfeaf7);
    font-family:Arial,Helvetica,sans-serif;color:var(--text);min-height:100vh}
  button,input,select,textarea{font:inherit}
  button{cursor:pointer}

  .page{width:100%;max-width:1240px;margin:0 auto}

  .band{
    background:linear-gradient(120deg,#102949,#245d9c);color:#fff;
    border-radius:16px;padding:22px 28px;margin-bottom:20px;
    box-shadow:0 18px 50px #16345417;display:flex;justify-content:space-between;
    align-items:center;gap:16px;flex-wrap:wrap;border-top:5px solid #58a4ff;
  }
  .band-left{display:flex;align-items:center;gap:14px}
  .band-logo{width:48px;height:48px;border-radius:50%;background:#fff;display:grid;place-items:center;
    overflow:hidden;color:var(--navy);font-weight:900;font-size:18px;border:3px solid #d8e8ff;flex:0 0 48px}
  .band-logo img{width:100%;height:100%;object-fit:contain}
  .band h1{margin:0;font-size:19px;letter-spacing:.3px;text-transform:uppercase}
  .band p{margin:4px 0 0;font-size:11px;color:#cfdcf5}
  .band-user{display:flex;align-items:center;gap:10px;font-size:11px;color:#cfdcf5;
    background:#ffffff14;border:1px solid #ffffff36;padding:7px 12px;border-radius:20px}
  .band-user strong{color:#fff}

  .health-strip{
    background:#fff;border:1px solid var(--line);border-radius:13px;
    box-shadow:var(--shadow);padding:14px 18px;margin-bottom:16px;
    display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:12px;
    color:#34415c;line-height:1.6;
  }
  .health-strip .badge{
    display:inline-flex;align-items:center;gap:6px;
    background:#fff8e6;color:#8a6a1a;border:1px solid #f3d999;
    padding:5px 10px;border-radius:20px;font-size:11px;font-weight:800;
  }
  .health-strip .badge.danger{background:#fff0f1;color:#bd3b48;border-color:#f6c9ce}
  .health-strip .badge.ok{background:#e6f7f0;color:#16835f;border-color:#b8e9d3}

  .stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}
  .stat{background:#fff;border:1px solid var(--line);border-radius:13px;padding:16px 18px;
    box-shadow:var(--shadow);position:relative;overflow:hidden}
  .stat::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--blue)}
  .stat.green::before{background:var(--green)}
  .stat.orange::before{background:var(--orange)}
  .stat.red::before{background:var(--red)}
  .stat small{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.8px;
    color:var(--muted);font-weight:800;margin-bottom:8px}
  .stat strong{font-size:22px;color:var(--navy);font-weight:800}

  .toolbar{display:flex;justify-content:space-between;gap:12px;align-items:center;
    flex-wrap:wrap;margin-bottom:16px}
  .toolbar-left{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
  .field,.pick{border:1px solid var(--line);border-radius:9px;padding:10px 12px;
    background:#fff;color:var(--text);font-size:12px;outline:none}
  .field{min-width:230px}
  .field:focus,.pick:focus{border-color:var(--blue)}

  .btn{border:0;border-radius:9px;padding:11px 15px;background:var(--blue);color:#fff;
    font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:7px}
  .btn:hover{filter:brightness(.96)}
  .btn.secondary{background:#eef2fb;color:#34415c}
  .btn.outline{background:#fff;color:#34415c;border:1px solid var(--line)}
  .btn.danger{background:#fff0f1;color:var(--red)}
  .btn.green{background:#e6f7f0;color:#16835f}
  .btn.warn{background:#fff2dd;color:#a86414}
  .btn:disabled{opacity:.5;cursor:not-allowed}

  .card{background:#fff;border:1px solid var(--line);border-radius:13px;
    box-shadow:var(--shadow);overflow:hidden}
  .card-head{display:flex;justify-content:space-between;align-items:center;
    padding:18px 22px;border-bottom:1px solid var(--line);gap:12px;flex-wrap:wrap}
  .card-head h3{margin:0;font-size:14px}
  .card-head .count{padding:4px 9px;border-radius:20px;background:#edf2ff;color:#3b5cc1;
    font-size:10px;font-weight:800}

  .table-wrap{overflow-x:auto}
  table{width:100%;border-collapse:collapse;white-space:nowrap}
  th{text-align:left;background:#fafbfe;color:#7a8498;font-size:10px;
    text-transform:uppercase;letter-spacing:.6px;padding:13px 18px;
    border-bottom:1px solid var(--line)}
  td{padding:13px 18px;border-bottom:1px solid #f0f2f7;font-size:12px}
  tbody tr:last-child td{border-bottom:0}

  .person{display:flex;align-items:center;gap:10px}
  .mini-avatar{width:32px;height:32px;display:grid;place-items:center;border-radius:10px;
    background:#edf2ff;color:#3859b7;font-size:10px;font-weight:700}
  .person strong{display:block;font-size:12px}
  .person small{display:block;color:var(--muted);font-size:10px;margin-top:4px}

  .role-badge{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;
    border-radius:20px;font-size:10px;font-weight:800;letter-spacing:.5px;text-transform:uppercase}
  .role-badge.principal{background:#eaf0fb;color:#2f4d8a}
  .role-badge.registrar{background:#fff2dd;color:#a86414}
  .role-badge.teacher{background:#e6f7f0;color:#16835f}
  .role-badge.student{background:#f4eaff;color:#6b3da5}
  .role-badge.parent{background:#e6f0fb;color:#1d4d82}

  .pill{display:inline-block;padding:5px 8px;border-radius:20px;font-size:10px;font-weight:700}
  .pill.green{background:#e6f7f0;color:#16835f}
  .pill.red{background:#ffeaec;color:#bd3b48}
  .pill.blue{background:#edf2ff;color:#3b5cc1}
  .pill.orange{background:#fff2dd;color:#a86414}

  .row-actions{display:flex;gap:5px;flex-wrap:wrap}
  .row-actions .btn{padding:7px 10px;font-size:11px}

  .empty{padding:60px 20px;text-align:center;color:var(--muted);font-size:13px}

  .perm-section{margin-top:14px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .perm-section-head{padding:11px 14px;background:#f8faff;font-size:11px;font-weight:800;
    color:#34415c;text-transform:uppercase;letter-spacing:1px;border-bottom:1px solid var(--line)}

  .perm-item{border-bottom:1px solid #f0f2f7;padding:10px 14px 12px;transition:background .15s}
  .perm-item:last-child{border-bottom:0}
  .perm-item.disabled{background:#fbfbfd;opacity:.55}
  .perm-item.forbidden{background:#fff6f6;border-left:3px solid #f6c9ce}
  .perm-item.forbidden .perm-text strong::after{
    content:" ⚠";font-size:11px;margin-left:4px;color:#bd3b48;
  }
  .perm-item.override{
    background:#fffbe6;
    border-left:3px solid #c99a2e;
  }
  .perm-item.override .perm-text strong::after{
    content:" ✎ OVERRIDE";
    font-size:9px;margin-left:6px;color:#8a6a1a;letter-spacing:.6px;
  }

  .perm-row{display:flex;justify-content:space-between;align-items:center;gap:14px}
  .perm-text strong{display:block;font-size:12px;color:var(--text)}
  .perm-text small{display:block;font-size:10px;color:var(--muted);margin-top:3px}

  .toggle{position:relative;display:inline-block;width:44px;height:24px;flex:0 0 44px}
  .toggle input{opacity:0;width:0;height:0}
  .toggle .slider{position:absolute;cursor:pointer;inset:0;background:#c9d1e0;border-radius:24px;transition:.2s}
  .toggle .slider:before{content:"";position:absolute;height:18px;width:18px;left:3px;top:3px;
    background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.15)}
  .toggle input:checked + .slider{background:#245d9c}
  .toggle input:checked + .slider:before{transform:translateX(20px)}
  .toggle input:disabled + .slider{opacity:.4;cursor:not-allowed}

  .sub-features{margin-top:10px;margin-left:14px;padding-left:12px;
    border-left:2px solid #eef2fb;display:grid;grid-template-columns:1fr 1fr;gap:6px 18px}
  .sub-feature{display:flex;justify-content:space-between;align-items:center;gap:10px;
    padding:5px 4px;opacity:1;transition:opacity .15s}
  .sub-features.disabled .sub-feature{opacity:.35}

  .sub-feature .sub-text strong{display:block;font-size:11px;font-weight:700;color:#3b4a63}
  .sub-feature .sub-text small{display:block;font-size:9px;color:var(--muted);margin-top:2px;line-height:1.35}

  .toggle.sm{width:34px;height:20px;flex:0 0 34px}
  .toggle.sm .slider:before{height:14px;width:14px;left:3px;top:3px}
  .toggle.sm input:checked + .slider:before{transform:translateX(14px)}

  .role-preset-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
  .role-preset-btn{border:1px dashed #b9c8e8;background:#f8faff;border-radius:8px;
    padding:7px 12px;font-size:11px;font-weight:800;color:#2f4d8a;cursor:pointer;letter-spacing:.3px}
  .role-preset-btn:hover{background:#eef2fb}
  .role-preset-btn.active{background:#245d9c;color:#fff;border-style:solid;border-color:#245d9c}
  .role-preset-btn:disabled{opacity:.4;cursor:not-allowed}

  .perm-search{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
  .perm-search input{flex:1 1 200px;border:1px solid #dfe4ee;border-radius:8px;
    padding:9px 11px;font-size:12px;outline:none}

  .link-btn{border:0;background:transparent;color:var(--blue);font-size:11px;font-weight:700;cursor:pointer}

  .child-picker-wrap{border:1px solid var(--line);border-radius:10px;background:#fff;margin-top:6px;overflow:hidden}
  .child-picker-head{display:flex;justify-content:space-between;align-items:center;gap:10px;
    padding:9px 12px;background:#f8faff;border-bottom:1px solid var(--line);font-size:11px;flex-wrap:wrap}
  .child-picker-head .selected-count{font-weight:800;color:var(--navy)}
  .child-picker-head .mini-actions{display:flex;gap:6px}
  .child-picker-head .mini-actions button{border:1px solid var(--line);background:#fff;
    border-radius:6px;padding:5px 9px;font-size:10px;font-weight:700;color:#34415c;cursor:pointer}
  .child-picker-head .mini-actions button:hover{background:#eef2fb}
  .child-picker-search{padding:8px 12px;border-bottom:1px solid #f0f2f7;background:#fff}
  .child-picker-search input{width:100%;border:1px solid #dfe4ee;border-radius:8px;
    padding:8px 10px;font-size:12px;outline:none}
  .child-picker-search input:focus{border-color:var(--blue)}
  .child-picker-list{max-height:260px;overflow-y:auto;padding:6px}
  .child-pick{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid transparent;
    border-radius:8px;cursor:pointer;transition:.12s}
  .child-pick:hover{background:#f3f6fd}
  .child-pick.ticked{background:#eaf2ff;border-color:#b9d1f6}
  .child-pick input{width:16px;height:16px;flex:0 0 16px;accent-color:#245d9c}
  .child-pick .who{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
  .child-pick .who strong{font-size:12px;color:var(--navy);font-weight:700}
  .child-pick .who small{font-size:10px;color:var(--muted)}
  .child-pick .mini-avatar{width:28px;height:28px;font-size:9px;border-radius:8px}

  .creds-card{background:#f8faff;border:1px solid #cfe3ff;border-radius:12px;
    padding:20px;margin-top:10px}
  .creds-card h4{margin:0 0 12px;font-size:13px;color:var(--navy);letter-spacing:.3px}
  .creds-row{display:flex;justify-content:space-between;gap:10px;padding:9px 12px;
    background:#fff;border:1px solid var(--line);border-radius:8px;margin-bottom:8px;
    font-family:monospace;font-size:13px}
  .creds-row span{color:var(--muted);font-family:Arial,Helvetica,sans-serif;font-size:11px;
    text-transform:uppercase;letter-spacing:.6px;font-weight:800}
  .creds-row strong{color:var(--navy)}
  .creds-row button{border:0;background:#eef2fb;color:#34415c;border-radius:6px;
    padding:5px 9px;font-size:10px;font-weight:800;cursor:pointer}
  .creds-warning{margin-top:10px;padding:10px 12px;background:#fff8e6;border:1px solid #f3d999;
    border-radius:8px;font-size:11px;color:#8a6a1a;line-height:1.6}
  .creds-warning strong{color:#5a3a00}

  .validation-banner{grid-column:1/-1;padding:12px 14px;border-radius:10px;
    font-size:12px;line-height:1.6;margin-top:6px}
  .validation-banner.error{background:#fff0f1;border:1px solid #f6c9ce;color:#8a1e28}
  .validation-banner.warn{background:#fff8e6;border:1px solid #f3d999;color:#8a6a1a}
  .validation-banner ul{margin:6px 0 0;padding-left:20px}
  .validation-banner li{margin-bottom:3px}

  .username-hint{font-size:10px;color:var(--muted);margin-top:4px;display:block}

  .password-wrap{display:flex;gap:6px;align-items:flex-start}
  .password-wrap input{flex:1}
  .password-wrap button{border:0;background:#eef2fb;color:#34415c;border-radius:8px;
    padding:11px 12px;font-size:11px;font-weight:800;cursor:pointer;white-space:nowrap}
  .password-wrap button:hover{background:#e1e9f8}
  .password-hint{font-size:10px;color:var(--muted);margin-top:4px;display:block;line-height:1.4}

  @media (max-width:850px){
    .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
    .sub-features{grid-template-columns:1fr}
  }
  @media (max-width:650px){
    body{padding:64px 8px 24px}
    .band{padding:18px 20px}
    .band h1{font-size:15px}
    .field,.pick{min-width:0;width:100%}
    .toolbar{flex-direction:column;align-items:stretch}
    .toolbar-left{width:100%}
    .stats{grid-template-columns:1fr}
  }
</style>
</head>
<body>

<div class="page">

  <div class="band">
    <div class="band-left">
      <div class="band-logo" id="bandLogo">EC</div>
      <div>
        <h1 id="bandSchool">User Management</h1>
        <p id="bandSub">Create users, assign roles, and control what each account can see</p>
      </div>
    </div>
    <div class="band-user">
      Signed in as <strong id="bandUser">—</strong>
    </div>
  </div>

  <div class="health-strip" id="healthStrip"></div>

  <div class="stats">
    <div class="stat"><small>Total users</small><strong id="kTotal">0</strong></div>
    <div class="stat green"><small>Active</small><strong id="kActive">0</strong></div>
    <div class="stat orange"><small>Disabled</small><strong id="kDisabled">0</strong></div>
    <div class="stat red"><small>Policy overrides</small><strong id="kViolations">0</strong></div>
  </div>

  <div class="toolbar">
    <div class="toolbar-left">
      <input class="field" id="search" placeholder="Search name or username...">
      <select class="pick" id="roleFilter">
        <option value="">All roles</option>
        <option>Principal</option>
        <option>Registrar</option>
        <option>Teacher</option>
        <option>Student</option>
        <option>Parent</option>
      </select>
      <select class="pick" id="statusFilter">
        <option value="">All statuses</option>
        <option value="active">Active only</option>
        <option value="disabled">Disabled only</option>
        <option value="violations">Overrides only</option>
      </select>
    </div>
    <div class="toolbar-left">
      <button class="btn" id="addBtn">＋ Create user</button>
    </div>
  </div>

  <div class="card">
    <div class="card-head">
      <h3>All users <span class="count" id="count">0</span></h3>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Username</th>
            <th>Role</th>
            <th>Linked</th>
            <th>Permissions</th>
            <th>Status</th>
            <th>Last login</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>

</div>

<script src="educore-shared.js"></script>
<script>
(function(){
  'use strict';
  const E = window.EduCore;

  const user = E.requirePerm('userManagement', 'User Management');
  if(!user) return;

  if(!E.canAssignRole('Principal')){
    E.showDenied('User Management');
    return;
  }

  const TOTAL_PERM_TOGGLES = E.renderedPermissionToggleCount();

  function paintHeader(){
    const settings = E.readStore(E.STORE_KEYS.settings, {}) || {};
    const name = settings.name || 'EduCore High School';
    if(settings.logo){
      document.getElementById('bandLogo').innerHTML = `<img src="${settings.logo}" alt="">`;
    } else {
      document.getElementById('bandLogo').textContent =
        name.split(/\s+/).filter(Boolean).slice(0,2).map(w => w[0]).join('').toUpperCase() || 'EC';
    }
    document.getElementById('bandSchool').textContent = name;
    document.getElementById('bandUser').textContent = user.name || user.username;
  }

  function roleBadge(r){
    return `<span class="role-badge ${(r||'').toLowerCase()}">${E.esc(r||'—')}</span>`;
  }
  function statusPill(active){
    return active ? '<span class="pill green">Active</span>' : '<span class="pill red">Disabled</span>';
  }

  function linkedNameFor(u){
    if(u.role === 'Student' && u.linkedStudentId){
      const s = (E.readStore(E.STORE_KEYS.students, []) || []).find(x => x.id === u.linkedStudentId);
      return s ? `${s.name} (${s.id})` : u.linkedStudentId;
    }
    if(u.role === 'Teacher' && u.linkedTeacherId){
      const t = (E.readStore(E.STORE_KEYS.teachers, []) || []).find(x => x.id === u.linkedTeacherId);
      return t ? t.name : u.linkedTeacherId;
    }
    if(u.role === 'Parent'){
      const ids = Array.isArray(u.linkedStudentIds) ? u.linkedStudentIds
                : (u.linkedStudentId ? [u.linkedStudentId] : []);
      if(!ids.length) return '—';
      const students = E.readStore(E.STORE_KEYS.students, []) || [];
      const names = ids
        .map(id => students.find(s => s.id === id))
        .filter(Boolean)
        .map(s => s.name);
      return names.length ? names.join(', ') : '—';
    }
    return '—';
  }

  function overridesFor(u){
    const out = [];
    Object.keys(u.permissions || {}).forEach(k => {
      if(u.permissions[k] && E.roleForbids(u.role, k)) out.push(k);
    });
    return out;
  }

  function missingLinksFor(u){
    const issues = [];
    const c = E.ROLE_CONSTRAINTS[u.role];
    if(c && c.requiredLink){
      const v = u[c.requiredLink];
      const empty = Array.isArray(v) ? !v.length : !v;
      if(empty) issues.push(`Missing required link (${c.requiredLink})`);
    }
    return issues;
  }

  function paintHealth(users){
    const strip = document.getElementById('healthStrip');
    const overrideCount = users.reduce((s,u) => s + overridesFor(u).length, 0);
    const missingLinkCount = users.filter(u => missingLinksFor(u).length).length;
    const lastPrincipals = users.filter(u => u.role === 'Principal' && u.active);

    const bits = [];
    if(lastPrincipals.length === 1){
      bits.push(`<span class="badge">Only 1 active Principal — guard in place</span>`);
    } else if(lastPrincipals.length === 0){
      bits.push(`<span class="badge danger">No active Principal — nobody can manage users!</span>`);
    }
    if(missingLinkCount){
      bits.push(`<span class="badge danger">${missingLinkCount} account${missingLinkCount === 1 ? '' : 's'} missing a required link</span>`);
    }
    if(overrideCount){
      bits.push(`<span class="badge">${overrideCount} permission override${overrideCount === 1 ? '' : 's'} across accounts</span>`);
    } else {
      bits.push(`<span class="badge ok">No overrides — all accounts follow their role defaults</span>`);
    }
    strip.innerHTML = `<strong>Health:</strong> ` + bits.join(' ');
    return overrideCount;
  }

  function paintTable(){
    const users = E.readStore(E.STORE_KEYS.users, []) || [];
    const q = document.getElementById('search').value.toLowerCase();
    const role = document.getElementById('roleFilter').value;
    const status = document.getElementById('statusFilter').value;

    const arr = users.filter(u => {
      if(q && !(`${u.name} ${u.username}`).toLowerCase().includes(q)) return false;
      if(role && u.role !== role) return false;
      if(status === 'active' && !u.active) return false;
      if(status === 'disabled' && u.active) return false;
      if(status === 'violations' && !overridesFor(u).length) return false;
      return true;
    }).sort((a,b) => {
      const order = { Principal:0, Registrar:1, Teacher:2, Student:3, Parent:4 };
      const ra = order[a.role] ?? 9, rb = order[b.role] ?? 9;
      if(ra !== rb) return ra - rb;
      return (a.name||a.username).localeCompare(b.name||b.username);
    });

    const active = users.filter(u => u.active).length;
    const disabled = users.length - active;
    const overrideCount = paintHealth(users);

    document.getElementById('kTotal').textContent = users.length;
    document.getElementById('kActive').textContent = active;
    document.getElementById('kDisabled').textContent = disabled;
    document.getElementById('kViolations').textContent = overrideCount;

    const tb = document.getElementById('tbody');
    tb.innerHTML = arr.map(u => {
      const permKeys = new Set(E.ALL_KEYS);
      const permCount = Object.keys(u.permissions || {})
        .filter(k => u.permissions[k] && permKeys.has(k))
        .length;
      const isSelf = u.id === user.id;
      const overrides = overridesFor(u);
      const missing = missingLinksFor(u);
      const flagBits = [];
      if(missing.length) flagBits.push(`<span class="pill red" title="${E.esc(missing.join(' · '))}" style="margin-left:6px">⚠</span>`);
      if(overrides.length) flagBits.push(`<span class="pill orange" title="${E.esc(overrides.join(' · '))}" style="margin-left:6px">✎ ${overrides.length}</span>`);

      return `<tr>
        <td>
          <div class="person">
            <div class="mini-avatar">${E.initials(u.name || u.username)}</div>
            <div><strong>${E.esc(u.name || u.username)}</strong><small>${isSelf ? 'You' : ''}</small></div>
          </div>
        </td>
        <td>${E.esc(u.username)}</td>
        <td>${roleBadge(u.role)}${flagBits.join('')}</td>
        <td>${E.esc(linkedNameFor(u))}</td>
        <td><span class="pill blue">${permCount} / ${TOTAL_PERM_TOGGLES}</span></td>
        <td>${statusPill(u.active)}</td>
        <td>${u.lastLogin ? E.fmtDateTime(u.lastLogin) : '—'}</td>
        <td>
          <div class="row-actions">
            <button class="btn secondary" data-edit="${E.esc(u.id)}">Edit</button>
            ${!isSelf ? `<button class="btn ${u.active?'danger':'green'}" data-toggle="${E.esc(u.id)}">
              ${u.active ? 'Disable' : 'Enable'}
            </button>` : ''}
          </div>
        </td>
      </tr>`;
    }).join('') || '<tr><td colspan="8" class="empty">No users match your filters.</td></tr>';

    document.getElementById('count').textContent = arr.length;
  }

  function strongPassword(){
    const upper = 'ABCDEFGHJKLMNPQRSTUVWXYZ';
    const lower = 'abcdefghijkmnopqrstuvwxyz';
    const digit = '23456789';
    const symbol = '!@#%*';
    const all = upper + lower + digit + symbol;
    const pick = set => set[Math.floor(Math.random() * set.length)];
    let out = pick(upper) + pick(lower) + pick(digit) + pick(symbol);
    for(let i = 0; i < 8; i++) out += pick(all);
    const arr = out.split('');
    for(let i = arr.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr.join('');
  }

  function checkPasswordPolicy(pw){
    const errors = [];
    if(pw.length < 8) errors.push('At least 8 characters');
    if(!/[A-Z]/.test(pw)) errors.push('At least one uppercase letter');
    if(!/[a-z]/.test(pw)) errors.push('At least one lowercase letter');
    if(!/[0-9]/.test(pw)) errors.push('At least one digit');
    if(!/[!@#%*^&()_\-+=.,;:]/.test(pw)) errors.push('At least one symbol');
    return errors;
  }

  async function hashPassword(plain){
    try{
      const enc = new TextEncoder().encode('educore::' + plain);
      const buf = await crypto.subtle.digest('SHA-256', enc);
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
    }catch(e){
      let h = 0;
      for(let i = 0; i < plain.length; i++){ h = (h*31 + plain.charCodeAt(i)) >>> 0; }
      return 'fb' + h.toString(16);
    }
  }

  function slugifyUsername(name){
    let s = String(name || '').trim();
    if(!s) return '';
    s = s.replace(/\b(mr|mrs|ms|miss|dr|prof|sir|madam)\.?\b/gi, '').trim();
    s = s.toLowerCase().replace(/[^a-z0-9\s._-]/g, '');
    s = s.replace(/\s+/g, '.');
    s = s.replace(/\.+/g, '.');
    s = s.replace(/^[._-]+|[._-]+$/g, '');
    return s;
  }

  function uniqueUsername(base, existingUsers, selfId){
    if(!base) return '';
    const taken = new Set((existingUsers || [])
      .filter(u => u.id !== selfId)
      .map(u => String(u.username || '').toLowerCase()));
    if(!taken.has(base)) return base;
    let n = 2;
    while(taken.has(base + n)) n++;
    return base + n;
  }

  function buildPermSections(u){
    const perms = Object.assign({}, u.permissions || {});

    return E.PERMISSION_GROUPS.map(g => {
      const items = g.items.map(it => {
        const menuForbidden = E.roleForbids(u.role, it.key);
        const menuOn = !!perms[it.key];
        const menuIsOverride = menuForbidden && menuOn;

        const subHTML = (it.subFeatures || []).map(sf => {
          const fullKey = it.key + '.' + sf.key;
          const subForbidden = E.roleForbids(u.role, fullKey);
          const value = Object.prototype.hasOwnProperty.call(perms, fullKey)
                ? !!perms[fullKey]
                : menuOn;
          const subIsOverride = subForbidden && value;
          return `
            <div class="sub-feature ${subIsOverride ? 'override' : ''}"
                 data-sub-label="${E.esc((sf.label + ' ' + sf.desc).toLowerCase())}">
              <div class="sub-text">
                <strong>${E.esc(sf.label)}${subIsOverride ? ' ✎' : ''}</strong>
                <small>${E.esc(sf.desc)}${subForbidden ? ' · <em style="color:#a86414">normally off for '+E.esc(u.role)+'</em>' : ''}</small>
              </div>
              <label class="toggle sm">
                <input type="checkbox"
                  data-perm-toggle="${E.esc(fullKey)}"
                  data-parent-menu="${E.esc(it.key)}"
                  ${value ? 'checked' : ''}>
                <span class="slider"></span>
              </label>
            </div>`;
        }).join('');

        const hasSubs = (it.subFeatures || []).length > 0;
        const subBlock = hasSubs
          ? `<div class="sub-features ${menuOn ? '' : 'disabled'}" data-sub-block="${E.esc(it.key)}">
               ${subHTML}
             </div>`
          : '';

        const itemClass = [
          'perm-item',
          menuOn ? '' : 'disabled',
          menuForbidden ? 'forbidden' : '',
          menuIsOverride ? 'override' : ''
        ].filter(Boolean).join(' ');

        return `
          <div class="${itemClass}"
               data-perm-key="${E.esc(it.key)}"
               data-label="${E.esc((it.label + ' ' + it.desc).toLowerCase())}">
            <div class="perm-row">
              <div class="perm-text">
                <strong>${E.esc(it.label)}${menuIsOverride ? ' ✎ OVERRIDE' : ''}</strong>
                <small>${E.esc(it.desc)}${menuForbidden ? ' · <em style="color:#a86414">normally off for '+E.esc(u.role)+'</em>' : ''}</small>
              </div>
              <label class="toggle">
                <input type="checkbox"
                  data-perm-toggle="${E.esc(it.key)}"
                  data-main-menu="${E.esc(it.key)}"
                  ${menuOn ? 'checked' : ''}>
                <span class="slider"></span>
              </label>
            </div>
            ${subBlock}
          </div>`;
      }).join('');

      return `
        <div class="perm-section" data-group="${E.esc(g.title)}">
          <div class="perm-section-head">${E.esc(g.title)}</div>
          ${items}
        </div>`;
    }).join('');
  }

          ${students.length ? `
          <div class="child-picker-search">

        if(!autoFillState.active) return;
        const slug = slugifyUsername(nameInput.value);
        const unique = uniqueUsername(slug, users, u.id || null);
        usernameInput.value = unique;
        if(usernameHint){
          usernameHint.textContent = unique
            ? 'Auto-generated from the full name. Edit to override.'

      usernameInput.addEventListener('input', () => {
        const slug = uniqueUsername(slugifyUsername(nameInput.value), users, u.id || null);
        if(usernameInput.value.trim() !== slug){
          autoFillState.active = false;
          if(usernameHint) usernameHint.textContent = 'Editing manually.';

    document.getElementById('genPassBtn')?.addEventListener('click', () => {

        field.type = 'text';
        field.focus();
        field.select();
      }

    /* ---------- PERMISSION HELPERS ---------- */
    function syncSubBlock(menuKey, menuOn){
      const block = document.querySelector(`[data-sub-block="${menuKey}"]`);
      const item = document.querySelector(`.perm-item[data-perm-key="${menuKey}"]`);
      if(item) item.classList.toggle('disabled', !menuOn);
      if(!block) return;
      block.classList.toggle('disabled', !menuOn);
    }

    function refreshOverrideStyles(role){
      document.querySelectorAll('.perm-item').forEach(item => {
        const key = item.dataset.permKey;
        const cb = item.querySelector('[data-perm-toggle="' + key + '"]');
        const isOverride = E.roleForbids(role, key) && cb && cb.checked;
        item.classList.toggle('forbidden', E.roleForbids(role, key));
        item.classList.toggle('override', isOverride);
        const strong = item.querySelector('.perm-text strong');
        if(strong){
          const base = strong.dataset.baseText || strong.textContent.replace(/\s*✎.*$/, '').trim();
          strong.dataset.baseText = base;
          strong.innerHTML = E.esc(base) + (isOverride ? ' ✎ OVERRIDE' : '');
        }
      });
    }

    function applyRole(role, { silent, mode } = {}){
      mode = mode || (silent ? 'saved' : 'preset');
      currentRole.value = role;
      const hidden = document.getElementById('roleHiddenInput');
      if(hidden) hidden.value = role;

      const preset = E.ROLE_PRESETS[role] || {};

      E.ALL_KEYS.forEach(k => {
        const cb = document.querySelector(`[data-perm-toggle="${k}"]`);
        if(!cb) return;

        cb.disabled = false;

        if(mode === 'saved' && Object.prototype.hasOwnProperty.call(savedPerms, k)){
          cb.checked = !!savedPerms[k];
        } else {
          cb.checked = !!preset[k];
        }
      });

      document.querySelectorAll('[data-main-menu]').forEach(cb => {
        syncSubBlock(cb.dataset.mainMenu, cb.checked);
      });

      document.querySelectorAll('.perm-item').forEach(item => {
        const k = item.dataset.permKey;
        item.classList.toggle('forbidden', E.roleForbids(role, k));
      });

      const ls = document.getElementById('linkedStudentField');
      const lp = document.getElementById('linkedParentField');
      const lt = document.getElementById('linkedTeacherField');
      if(ls) ls.style.display = role === 'Student' ? '' : 'none';
      if(lp) lp.style.display = role === 'Parent'  ? '' : 'none';
      if(lt) lt.style.display = role === 'Teacher' ? '' : 'none';

      document.querySelectorAll('#rolePresetRow .role-preset-btn').forEach(b =>
        b.classList.toggle('active', b.dataset.role === role));

      refreshOverrideStyles(role);
      renderValidationBanner();

      if(!silent){
        E.toast(`Applied ${role} preset — forbidden features are now warnings only.`);
      }
    }

    document.querySelectorAll('#rolePresetRow .role-preset-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const r = btn.dataset.role;
        if(r === currentRole.value) return;
        if(!confirm(`Apply the ${r} preset?\n\nThis resets every permission slider to the recommended defaults. Any overrides you've set will be lost.`)) return;
        applyRole(r, { mode: 'preset' });
      });
    });

    if(u.role){
      applyRole(u.role, { silent:true, mode: 'saved' });
    } else {
      document.querySelectorAll('[data-main-menu]').forEach(cb => {
        syncSubBlock(cb.dataset.mainMenu, cb.checked);
      });
    }

    document.querySelectorAll('[data-main-menu]').forEach(cb => {
      cb.addEventListener('change', () => {
        syncSubBlock(cb.dataset.mainMenu, cb.checked);
        refreshOverrideStyles(currentRole.value);
        renderValidationBanner();
      });
    });
    document.querySelectorAll('[data-perm-toggle]:not([data-main-menu])').forEach(cb => {
      cb.addEventListener('change', () => {
        refreshOverrideStyles(currentRole.value);
        renderValidationBanner();
      });
    });
    ['linkedStudentId','linkedTeacherId'].forEach(name => {
      const el = document.querySelector(`[name="${name}"]`);
      if(el) el.addEventListener('change', renderValidationBanner);
    });
    document.querySelectorAll('[data-parent-student]').forEach(cb => {
      cb.addEventListener('change', renderValidationBanner);
    });

    document.getElementById('permSelectAll').addEventListener('click', () => {
      E.ALL_KEYS.forEach(k => {
        const cb = document.querySelector(`[data-perm-toggle="${k}"]`);
        if(!cb) return;
        cb.checked = true;
      });
      document.querySelectorAll('[data-main-menu]').forEach(cb => {
        syncSubBlock(cb.dataset.mainMenu, true);
      });
      refreshOverrideStyles(currentRole.value);
      renderValidationBanner();
    });
    document.getElementById('permClearAll').addEventListener('click', () => {
      E.ALL_KEYS.forEach(k => {
        const cb = document.querySelector(`[data-perm-toggle="${k}"]`);
        if(!cb) return;
        cb.checked = false;
      });
      document.querySelectorAll('[data-main-menu]').forEach(cb => {
        syncSubBlock(cb.dataset.mainMenu, false);
      });
      refreshOverrideStyles(currentRole.value);
      renderValidationBanner();
    });
    document.getElementById('permResetRole')?.addEventListener('click', () => {
      if(!currentRole.value){ E.toast('Pick a role first.'); return; }
      if(!confirm(`Reset all sliders to the ${currentRole.value} preset?`)) return;
      applyRole(currentRole.value, { silent:true, mode: 'preset' });
    });

    document.getElementById('permSearch').addEventListener('input', e => {
      const q = e.target.value.toLowerCase().trim();
      document.querySelectorAll('#permContainer .perm-item').forEach(item => {
        const menuLabel = item.dataset.label || '';
        const subs = Array.from(item.querySelectorAll('.sub-feature'));
        const subMatch = subs.some(sf => (sf.dataset.subLabel || '').includes(q));
        const menuMatch = menuLabel.includes(q);
        item.style.display = (!q || menuMatch || subMatch) ? '' : 'none';
      });
    });

    document.getElementById('resetPassBtn')?.addEventListener('click', () => {
      const np = strongPassword();
      const ok = confirm(
        `Generate a new temporary password for ${u.username}?\n\n` +
        `Password: ${np}\n\n` +
        `It will be shown once so you can copy it. The user must change it on next sign-in.\n` +
        `The login card will display this password until the user changes it.`
      );
      if(!ok) return;
      showCredentialsModal({ name: u.name, username: u.username, password: np });
      (async () => {
        const list = E.readStore(E.STORE_KEYS.users, []) || [];
        const t = list.find(x => x.id === u.id);
        if(!t) return;
        t.passwordHash = await hashPassword(np);
        t.mustChangePassword = true;
        t.demoHint = np;
        t.demoHintState = 'reset';
        E.writeStore(E.STORE_KEYS.users, list);
        E.audit('update', `User ${t.username}`, '', 'password reset by admin');
      })();
    });

    document.getElementById('deleteUserBtn')?.addEventListener('click', () => {
      const list = E.readStore(E.STORE_KEYS.users, []) || [];
      const others = list.filter(x => x.id !== u.id && x.role === 'Principal' && x.active);
      if(u.role === 'Principal' && others.length === 0){
        alert('Cannot delete this account — it is the only active Principal.');
        return;
      }
      const typed = prompt(`Type the username "${u.username}" to permanently delete this user:`);
      if(typed !== u.username){ E.toast('Username did not match.'); return; }
      const remaining = list.filter(x => x.id !== u.id);
      E.writeStore(E.STORE_KEYS.users, remaining);
      E.audit('delete', `User ${u.username}`, '', '');
      E.closeModal();
      paintTable();
      E.toast('User deleted.');
    });

    const childCountLabel = document.getElementById('childCountLabel');
    const childPickerList = document.getElementById('childPickerList');
    const childSearch     = document.getElementById('childSearch');

    function refreshChildCount(){
      const ticked = document.querySelectorAll('[data-parent-student]:checked').length;
      if(childCountLabel){
        childCountLabel.textContent = ticked === 0
          ? 'No children selected'
          : ticked === 1
            ? '1 child selected'
            : `${ticked} children selected`;
      }
      document.querySelectorAll('.child-pick').forEach(row => {
        const cb = row.querySelector('input[data-parent-student]');
        row.classList.toggle('ticked', !!(cb && cb.checked));
      });
    }

    childPickerList?.addEventListener('change', e => {
      if(e.target.matches('[data-parent-student]')){
        refreshChildCount();
        renderValidationBanner();
      }
    });
    document.getElementById('childSelectAll')?.addEventListener('click', () => {
      document.querySelectorAll('[data-parent-student]').forEach(cb => { cb.checked = true; });
      refreshChildCount(); renderValidationBanner();
    });
    document.getElementById('childClearAll')?.addEventListener('click', () => {
      document.querySelectorAll('[data-parent-student]').forEach(cb => { cb.checked = false; });
      refreshChildCount(); renderValidationBanner();
    });

    childSearch?.addEventListener('input', e => {
      const q = e.target.value.trim().toLowerCase();
      document.querySelectorAll('.child-pick').forEach(row => {
        row.style.display = (!q || row.dataset.search.includes(q)) ? '' : 'none';
      });
    });

    refreshChildCount();

    function renderValidationBanner(){
      const banner = document.getElementById('validationBanner');
      if(!banner) return;

      const role = currentRole.value;
      if(!role){
        banner.className = 'validation-banner warn';
        banner.innerHTML = 'Pick a role to see validation.';
        return;
      }

      const nameEl = document.querySelector('[name="name"]');
      const usernameEl = document.querySelector('[name="username"]');
      const activeEl = document.querySelector('[name="active"]');
      const passwordEl = document.querySelector('[name="password"]');
      const linkedStudentEl = document.querySelector('[name="linkedStudentId"]');
      const linkedTeacherEl = document.querySelector('[name="linkedTeacherId"]');
      const parentIds = Array.from(document.querySelectorAll('[data-parent-student]:checked'))
        .map(x => x.dataset.parentStudent);

      const perms = {};
      E.ALL_KEYS.forEach(k => {
        const cb = document.querySelector(`[data-perm-toggle="${k}"]`);
        perms[k] = !!(cb && cb.checked);
      });

      const proposed = {
        id: u.id,
        name: (nameEl?.value || '').trim(),
        username: (usernameEl?.value || '').trim(),
        role,
        active: !!activeEl?.checked,
        linkedStudentId: linkedStudentEl?.value || '',
        linkedStudentIds: parentIds,
        linkedTeacherId: linkedTeacherEl?.value || '',
        permissions: perms
      };

      const allUsers = E.readStore(E.STORE_KEYS.users, []) || [];
      const result = E.validateUserRecord(proposed, allUsers, u.id || null);

      if(isNew && proposed.username.length < 3){
        result.errors.push('Username must be at least 3 characters.');
        result.ok = false;
      }

      if(isNew){
        const pw = (passwordEl?.value || '');
        if(!pw){
          result.errors.push('Password is required.');
          result.ok = false;
        } else {
          const pwIssues = checkPasswordPolicy(pw);
          pwIssues.forEach(msg => result.errors.push('Password: ' + msg + '.'));
          if(pwIssues.length) result.ok = false;
        }
      }

      if(result.errors.length){
        banner.className = 'validation-banner error';
        banner.innerHTML =
          `<strong>Fix before saving:</strong><ul>` +
          result.errors.map(e => `<li>${E.esc(e)}</li>`).join('') +
          `</ul>`;
      } else if(result.warnings.length){
        banner.className = 'validation-banner warn';
        banner.innerHTML =
          `<strong>Heads up:</strong><ul>` +
          result.warnings.map(w => `<li>${E.esc(w)}</li>`).join('') +
          `</ul>`;
      } else {
        banner.className = 'validation-banner';
        banner.style.background = '#e6f7f0';
        banner.style.border = '1px solid #b8e9d3';
        banner.style.color = '#16835f';
        banner.innerHTML = '✓ Looks good — ready to save.';
      }

      const submit = document.querySelector('.educore-modal-actions .ecedu-btn:not(.outline)');
      if(submit) submit.disabled = !result.ok;
    }

    ['name','username','password','active'].forEach(n => {
      const el = document.querySelector(`[name="${n}"]`);
      if(el) el.addEventListener('input', renderValidationBanner);
    });

    renderValidationBanner();
  }

  async function submitUserModal({ d, u, isNew, users, students, teachers }){
    const role = (d.role && String(d.role)) || '';
    if(!role){ E.toast('Pick a role first.'); return; }

    const perms = {};
    E.ALL_KEYS.forEach(k => {
      const cb = document.querySelector(`[data-perm-toggle="${k}"]`);
      perms[k] = !!(cb && cb.checked);
    });

    const parentIds = Array.from(document.querySelectorAll('[data-parent-student]:checked'))
      .map(x => x.dataset.parentStudent);

    const proposed = {
      id: u.id,
      name: (d.name || '').trim(),
      username: (d.username || '').trim(),
      email: (d.email || '').trim(),
      phone: (d.phone || '').trim(),
      role,
      active: !!d.active,
      linkedStudentId: role === 'Student' ? d.linkedStudentId : null,
      linkedStudentIds: role === 'Parent' ? parentIds : null,
      linkedTeacherId: role === 'Teacher' ? d.linkedTeacherId : null,
      permissions: perms
    };

    if(isNew){
      if(!d.password){
        E.toast('Password required.'); return;
      }
      const pwErrors = checkPasswordPolicy(d.password);
      if(pwErrors.length){
        E.toast('Password does not meet policy: ' + pwErrors.join(', '));
        return;
      }
    }

    const v = E.validateUserRecord(proposed, users, u.id || null);
    if(!v.ok){
      E.toast('Cannot save: ' + v.errors[0]);
      return;
    }

    if(isNew){
      const hash = await hashPassword(d.password);
      const newId = 'u-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2,6);
      const record = Object.assign({}, proposed, {
        id: newId,
        passwordHash: hash,
        mustChangePassword: true,
        demoHint: d.password,
        demoHintState: 'custom',
        createdAt: new Date().toISOString(),
        createdBy: user.username,
        lastLogin: null
      });
      users.push(record);
      E.writeStore(E.STORE_KEYS.users, users);
      const enabledCount = Object.values(perms).filter(Boolean).length;
      E.audit('create', `User ${record.username}`, '',
        `${record.role} · ${enabledCount} of ${TOTAL_PERM_TOGGLES} permissions`);

      E.closeModal();
      showCredentialsModal({
        name: record.name,
        username: record.username,
        password: d.password
      });
      paintTable();
    } else {
      const target = users.find(x => x.id === u.id);
      if(!target) return;

      const before = {
        role: target.role,
        active: target.active,
        enabled: Object.values(target.permissions || {}).filter(Boolean).length
      };

      Object.assign(target, {
        name: proposed.name,
        email: proposed.email,
        phone: proposed.phone,
        role: proposed.role,
        linkedStudentId: proposed.linkedStudentId,
        linkedStudentIds: proposed.linkedStudentIds,
        linkedTeacherId: proposed.linkedTeacherId,
        permissions: proposed.permissions,
        active: proposed.active,
        updatedAt: new Date().toISOString(),
        updatedBy: user.username
      });

      E.writeStore(E.STORE_KEYS.users, users);

      const after = {
        role: target.role,
        active: target.active,
        enabled: Object.values(target.permissions || {}).filter(Boolean).length
      };

      E.audit('update', `User ${target.username}`,
        JSON.stringify(before),
        JSON.stringify(after));
      E.closeModal();
      paintTable();
      E.toast('User updated.');
    }
  }

  function toggleActive(id){
    const list = E.readStore(E.STORE_KEYS.users, []) || [];
    const u = list.find(x => x.id === id);
    if(!u) return;
    if(u.id === user.id){ E.toast('You cannot disable your own account.'); return; }

    if(u.role === 'Principal' && u.active){
      const others = list.filter(x => x.id !== u.id && x.role === 'Principal' && x.active);
      if(others.length === 0){
        alert('This is the only active Principal. Disabling it would lock everyone out of User Management.');
        return;
      }
    }

    if(u.active){
      if(!confirm(`Disable ${u.name || u.username}?\n\nThey will not be able to sign in until re-enabled.`)) return;
    }
    u.active = !u.active;
    E.writeStore(E.STORE_KEYS.users, list);
    E.audit('update', `User ${u.username}`, '', u.active ? 'enabled' : 'disabled');
    paintTable();
    E.toast(`User ${u.active ? 'enabled' : 'disabled'}.`);
  }

  document.addEventListener('click', e => {
    const btn = e.target.closest('[data-copy]');
    if(!btn) return;
    const text = btn.dataset.copy;
    if(!text) return;
    try{
      navigator.clipboard.writeText(text).then(() => {
        const orig = btn.textContent;
        btn.textContent = 'Copied';
        setTimeout(() => btn.textContent = orig, 1200);
      }).catch(() => E.toast('Copy failed — select manually.'));
    } catch(err){
      E.toast('Copy not available in this browser.');
    }
  });

  document.getElementById('search').addEventListener('input', paintTable);
  document.getElementById('roleFilter').addEventListener('change', paintTable);
  document.getElementById('statusFilter').addEventListener('change', paintTable);
  document.getElementById('addBtn').addEventListener('click', () => openUserModal(null));

  document.getElementById('tbody').addEventListener('click', e => {
    const edit = e.target.closest('[data-edit]');
    const toggle = e.target.closest('[data-toggle]');
    if(edit) openUserModal(edit.dataset.edit);
    if(toggle) toggleActive(toggle.dataset.toggle);
  });

  paintHeader();
  paintTable();
})();
</script>
</body>
</html>
