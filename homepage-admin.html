<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home Page Editor | EduCore</title>
<style>
  :root{
    --navy:#12315a;--blue:#3987ee;--line:#e8ebf2;--text:#23354d;--muted:#73849a;
    --green:#14805e;--orange:#d88922;--red:#d64545;--gold:#c99a2e;--gold2:#fff4d6;
    --shadow:0 8px 24px rgba(24,42,78,.06);
    --shadow-lg:0 20px 60px rgba(24,42,78,.14);
  }
  *{box-sizing:border-box}
  body{margin:0;padding:64px 16px 40px;
    background:linear-gradient(135deg,#edf4fc,#dfeaf7);
    font-family:Arial,Helvetica,sans-serif;color:var(--text);min-height:100vh}
  button,input,select,textarea{font:inherit}
  button{cursor:pointer}
  .page{width:100%;max-width:1500px;margin:0 auto}

  .band{background:linear-gradient(120deg,#102949,#245d9c);color:#fff;
    border-radius:16px;padding:22px 28px;margin-bottom:20px;
    box-shadow:0 18px 50px #16345417;display:flex;justify-content:space-between;
    align-items:center;gap:16px;flex-wrap:wrap;border-top:5px solid #58a4ff}
  .band-left{display:flex;align-items:center;gap:14px}
  .band-logo{width:48px;height:48px;border-radius:50%;background:#fff;display:grid;place-items:center;
    overflow:hidden;color:var(--navy);font-weight:900;font-size:18px;border:3px solid #d8e8ff;flex:0 0 48px}
  .band-logo img{width:100%;height:100%;object-fit:contain}
  .band h1{margin:0;font-size:19px;letter-spacing:.3px;text-transform:uppercase}
  .band p{margin:4px 0 0;font-size:11px;color:#cfdcf5}
  .band-user{display:flex;align-items:center;gap:10px;font-size:11px;color:#cfdcf5;
    background:#ffffff14;border:1px solid #ffffff36;padding:7px 12px;border-radius:20px}
  .band-user strong{color:#fff}

  .btn{border:0;border-radius:9px;padding:11px 15px;background:var(--blue);color:#fff;
    font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:7px}
  .btn:hover{filter:brightness(.96)}
  .btn.secondary{background:#eef2fb;color:#34415c}
  .btn.outline{background:#fff;color:#34415c;border:1px solid var(--line)}
  .btn.danger{background:#fff0f1;color:var(--red)}
  .btn.green{background:#e6f7f0;color:#16835f}
  .btn.gold{background:linear-gradient(135deg,#f7d97a,#c99a2e);color:#5a3a00}
  .btn.small{padding:7px 11px;font-size:11px}
  .btn:disabled{opacity:.5;cursor:not-allowed}

  /* ---------- STATUS BAR ---------- */
  .status-bar{
    background:#fff;border:1px solid var(--line);border-radius:13px;
    box-shadow:var(--shadow);padding:14px 20px;margin-bottom:16px;
    display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;
    font-size:12px;
  }
  .status-bar .left{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .status-pill{
    display:inline-flex;align-items:center;gap:6px;
    padding:5px 11px;border-radius:20px;font-size:10.5px;font-weight:800;
    letter-spacing:.5px;text-transform:uppercase;
  }
  .status-pill.draft{background:#fff2dd;color:#a86414}
  .status-pill.live{background:#e6f7f0;color:#16835f}
  .status-pill.warn{background:#fff8e6;color:#8a6a1a}
  .status-bar .right{display:flex;gap:8px;flex-wrap:wrap}

  /* ---------- LAYOUT ---------- */
  .editor-layout{
    display:grid;grid-template-columns:520px 1fr;gap:20px;align-items:start;
  }

  /* ---------- TABS ---------- */
  .tabs-wrap{
    background:#fff;border:1px solid var(--line);border-radius:13px;
    box-shadow:var(--shadow);padding:10px;margin-bottom:14px;
    display:flex;gap:4px;flex-wrap:wrap;position:sticky;top:12px;z-index:5;
  }
  .tab-btn{
    border:0;background:transparent;padding:9px 13px;border-radius:8px;
    font-size:11.5px;font-weight:800;color:#54637d;cursor:pointer;
    display:inline-flex;align-items:center;gap:6px;transition:.15s;
  }
  .tab-btn:hover{background:#f3f6fd}
  .tab-btn.active{background:#14213d;color:#fff}
  .tab-btn .dot{
    display:inline-block;width:6px;height:6px;border-radius:50%;
    background:#94a3b8;margin-right:2px;
  }
  .tab-btn.active .dot{background:#58a4ff}

  /* ---------- EDITOR PANELS ---------- */
  .panel{
    background:#fff;border:1px solid var(--line);border-radius:13px;
    box-shadow:var(--shadow);overflow:hidden;margin-bottom:14px;
  }
  .panel-head{
    padding:16px 20px;border-bottom:1px solid var(--line);
    display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;
  }
  .panel-head h3{margin:0;font-size:14px;color:var(--navy)}
  .panel-head p{margin:4px 0 0;font-size:11px;color:var(--muted)}
  .panel-body{padding:20px}

  .field{
    display:flex;flex-direction:column;gap:6px;margin-bottom:16px;
  }
  .field:last-child{margin-bottom:0}
  .field label{
    font-size:10.5px;font-weight:800;color:#657089;
    text-transform:uppercase;letter-spacing:.7px;
  }
  .field .help{
    font-size:10.5px;color:var(--muted);line-height:1.5;margin-top:2px;
  }
  .field input,.field select,.field textarea{
    width:100%;border:1px solid #dfe4ee;border-radius:8px;
    padding:10px 12px;font-size:12.5px;outline:none;background:#f8faff;
    font-family:inherit;transition:.15s;
  }
  .field input:focus,.field select:focus,.field textarea:focus{
    border-color:var(--blue);background:#fff;
    box-shadow:0 0 0 3px rgba(65,105,225,.1);
  }
  .field textarea{min-height:90px;resize:vertical;line-height:1.6}
  .field input[type="number"]{max-width:140px}
  .field input[type="checkbox"]{width:auto;margin:0}

  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .field-row.cols-3{grid-template-columns:1fr 1fr 1fr}

  .toggle-row{
    display:flex;align-items:center;gap:10px;padding:11px 14px;
    background:#f8faff;border:1px solid var(--line);border-radius:9px;
    font-size:12.5px;margin-bottom:14px;
  }
  .toggle-row input[type="checkbox"]{
    width:18px;height:18px;cursor:pointer;margin:0;
  }
  .toggle-row label{font-weight:700;cursor:pointer;color:#34415c;flex:1}

  /* ---------- IMAGE UPLOAD ---------- */
  .img-field{
    display:flex;gap:12px;align-items:flex-start;
  }
  .img-preview{
    width:120px;height:120px;flex:0 0 120px;border:1px dashed #c9d1e0;
    border-radius:10px;background:#f8faff;
    display:grid;place-items:center;overflow:hidden;
    color:var(--muted);font-size:11px;text-align:center;
    position:relative;
  }
  .img-preview.wide{width:220px;height:124px;flex-basis:220px}
  .img-preview img{width:100%;height:100%;object-fit:cover}
  .img-preview .rm{
    position:absolute;top:4px;right:4px;background:#fff0f1;color:var(--red);
    border:0;border-radius:6px;padding:3px 7px;font-size:10px;font-weight:800;
    cursor:pointer;
  }
  .img-actions{display:flex;flex-direction:column;gap:8px;flex:1}

  /* ---------- REPEATER ITEMS ---------- */
  .repeater-item{
    background:#fbfdff;border:1px solid var(--line);border-radius:10px;
    padding:14px;margin-bottom:10px;position:relative;
  }
  .repeater-item .item-head{
    display:flex;justify-content:space-between;align-items:center;
    margin-bottom:10px;padding-bottom:10px;border-bottom:1px dashed var(--line);
    font-size:11px;color:var(--muted);font-weight:800;
    text-transform:uppercase;letter-spacing:.5px;
  }
  .repeater-item .item-head strong{color:var(--navy);font-size:12px}
  .repeater-item .item-actions{display:flex;gap:4px;flex-wrap:wrap}
  .repeater-item .item-actions button{
    border:0;border-radius:6px;padding:4px 8px;font-size:10px;
    font-weight:800;cursor:pointer;background:#eef2fb;color:#34415c;
  }
  .repeater-item .item-actions button:hover{background:#dde7f7}
  .repeater-item .item-actions button.danger{background:#fff0f1;color:#bd3b48}

  .add-item-btn{
    border:1px dashed #b9c8e8;background:#f8faff;border-radius:9px;
    padding:11px 16px;font-size:11.5px;font-weight:800;color:#2f4d8a;
    width:100%;cursor:pointer;text-align:center;
  }
  .add-item-btn:hover{background:#eef2fb}

  /* ---------- PREVIEW PANE ---------- */
  .preview-pane{
    background:#fff;border:1px solid var(--line);border-radius:13px;
    box-shadow:var(--shadow-lg);overflow:hidden;
    position:sticky;top:12px;
  }
  .preview-pane .pane-head{
    padding:12px 18px;border-bottom:1px solid var(--line);
    display:flex;justify-content:space-between;align-items:center;gap:10px;
    background:#fafbfe;font-size:11.5px;font-weight:700;
  }
  .preview-pane .pane-head span{color:var(--muted);font-weight:600}
  .preview-pane .frame-wrap{
    position:relative;width:100%;height:780px;overflow:hidden;
    background:#f5f7fb;
  }
  .preview-pane iframe{
    position:absolute;top:0;left:0;
    width:1400px;height:2000px;border:0;
    transform-origin:0 0;
  }
  .preview-pane .refresh-btn{
    border:1px solid var(--line);background:#fff;color:#34415c;
    border-radius:6px;padding:4px 9px;font-size:11px;font-weight:800;cursor:pointer;
  }
  .preview-pane .refresh-btn:hover{background:#eef2fb}

  /* ---------- FOOTER BAR ---------- */
  .save-footer{
    position:fixed;bottom:0;left:0;right:0;
    background:#fff;border-top:1px solid var(--line);
    box-shadow:0 -6px 20px rgba(24,42,78,.06);
    padding:14px 24px;z-index:100;
    display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;
  }
  .save-footer .note{
    font-size:11.5px;color:var(--muted);line-height:1.5;
  }
  .save-footer .note strong{color:var(--orange)}
  .save-footer .actions{display:flex;gap:8px;flex-wrap:wrap}
  body{padding-bottom:80px}

  /* ---------- DIAGNOSTIC BANNER ---------- */
  .diagnostic-banner{
    flex-basis:100%;margin-top:8px;padding:10px 14px;
    border-radius:9px;font-size:11.5px;line-height:1.7;
  }
  .diagnostic-banner.warn{background:#fff8e6;border:1px solid #f3d999;color:#8a6a1a}
  .diagnostic-banner.danger{background:#fff0f1;border:1px solid #f6c9ce;color:#bd3b48}
  .diagnostic-banner.info{background:#eef5ff;border:1px solid #cfe3ff;color:#1d4d82}
  .diagnostic-banner strong{display:block;margin-bottom:4px;font-size:12px}
  .diagnostic-banner ul{margin:6px 0 0;padding-left:20px}
  .diagnostic-banner li{margin-bottom:3px}

  /* ---------- MOBILE ---------- */
  @media (max-width:1100px){
    .editor-layout{grid-template-columns:1fr}
    .preview-pane{display:none}
    .tab-btn{padding:8px 11px;font-size:11px}
    /* PATCH: preview toggle button appears on tablet/mobile */
    .preview-toggle-btn{display:inline-flex !important}
  }
  @media (max-width:650px){
    body{padding:64px 8px 80px}
    .band{padding:18px 20px}
    .band h1{font-size:15px}
    .field-row,.field-row.cols-3{grid-template-columns:1fr}
    .img-preview{width:80px;height:80px;flex-basis:80px}
    .img-preview.wide{width:140px;height:80px;flex-basis:140px}
  }
</style>
</head>
<body>

<div class="page">

  <div class="band">
    <div class="band-left">
      <div class="band-logo" id="bandLogo">EC</div>
      <div>
        <h1 id="bandSchool">Home Page Editor</h1>
        <p id="bandSub">Manage the public landing page — content, sections, and publishing</p>
      </div>
    </div>
    <div class="band-user">Signed in as <strong id="bandUser">—</strong></div>
  </div>

  <div class="status-bar" id="statusBar"></div>

  <div class="editor-layout">
    <div>
      <div class="tabs-wrap" id="tabsWrap"></div>
      <div id="panelsWrap"></div>
    </div>

    <div class="preview-pane">
      <div class="pane-head">
        <span>🖥 Live Preview</span>
        <div style="display:flex;gap:8px;align-items:center">
          <span id="previewStatus">Loading…</span>
          <button class="refresh-btn" id="manualRefreshBtn" title="Refresh preview">↻</button>
        </div>
      </div>
      <div class="frame-wrap" id="frameWrap">
        <iframe id="previewFrame" src="about:blank" title="Home page preview"></iframe>
      </div>
    </div>
  </div>

</div>

<div class="save-footer">
  <div class="note" id="footerNote">Changes are saved locally. Click Publish to make them live.</div>
  <div class="actions">
    <button class="btn outline" id="discardBtn">↺ Discard changes</button>
    <button class="btn secondary preview-toggle-btn" id="previewBtn2" style="display:none">👁 Preview</button>
    <button class="btn secondary" id="previewBtn">👁 Preview in new tab</button>
    <button class="btn green" id="saveBtn">💾 Save draft</button>
    <button class="btn gold" id="publishBtn">🚀 Publish live</button>
  </div>
</div>

<script src="educore-shared.js?v=12"></script>
<script>
(function(){
  'use strict';
  const E = window.EduCore;

  /* ---------- GUARD ---------- */
  const user = E.requirePerm('homepage', 'Home Page Editor');
  if(!user) return;

  const canEdit = E.can('homepage.edit');
  const canPublish = E.can('homepage.publish');
  const canReset = E.can('homepage.reset');

  /* ---------- HEADER ---------- */
  function paintHeader(){
    const settings = E.readStore(E.STORE_KEYS.settings, {}) || {};
    const name = settings.name || 'EduCore High School';
    if(settings.logo){
      document.getElementById('bandLogo').innerHTML = `<img src="${settings.logo}" alt="">`;
    } else {
      document.getElementById('bandLogo').textContent =
        name.split(/\s+/).filter(Boolean).slice(0,2).map(w => w[0]).join('').toUpperCase() || 'EC';
    }
    document.getElementById('bandSchool').textContent = name;
    document.getElementById('bandUser').textContent = user.name || user.username;
  }

  /* ---------- STATE ---------- */
  const liveConfig = E.getHomepageLive();
  const draftConfig = E.getHomepageDraft();
  const state = {
    config: JSON.parse(JSON.stringify(draftConfig || liveConfig || E.DEFAULT_HOMEPAGE)),
    hasChanges: false,
    activeTab: 'hero'
  };

  function markChanged(){
    state.hasChanges = true;
    paintFooterNote();
    /* Save draft on every change (silent auto-save) */
    E.saveHomepageDraft(state.config);
  }

  function paintFooterNote(){
    const note = document.getElementById('footerNote');
    if(!state.hasChanges){
      note.innerHTML = 'No unsaved changes.';
      return;
    }
    note.innerHTML = `<strong>● Unsaved changes</strong> — save draft or publish live.`;
  }

  /* ---------- STATUS BAR (PATCH: unpublished + config warnings) ---------- */
  function paintStatusBar(){
    const live = E.getHomepageLive();
    const draft = E.getHomepageDraft();
    const liveTime = live?.updatedAt ? E.fmtDateTime(live.updatedAt) : 'never';
    const draftTime = draft?.updatedAt ? E.fmtDateTime(draft.updatedAt) : 'never';
    const draftIsDifferent = draft && live && JSON.stringify(draft) !== JSON.stringify(live);
    const hasLive = !!live;
    const hasDraft = !!draft;

    const bar = document.getElementById('statusBar');
    bar.innerHTML = `
      <div class="left">
        <span class="status-pill ${hasLive ? 'live' : 'draft'}">
          ${hasLive ? '● Live' : '○ Not published'}
        </span>
        <span style="color:var(--muted)">
          Live updated: <strong>${E.esc(liveTime)}</strong>
        </span>
        <span style="color:var(--muted)">
          Draft updated: <strong>${E.esc(draftTime)}</strong>
        </span>
        ${draftIsDifferent ? `<span class="status-pill warn">⚠ Draft differs from live</span>` : ''}
      </div>
      <div class="right">
        <a href="home.html?preview=1" target="_blank" class="btn outline small">↗ Open draft preview</a>
        <a href="home.html" target="_blank" class="btn outline small">↗ Open live page</a>
      </div>
    `;

    /* PATCH: never-published warning */
    if(!hasLive){
      bar.insertAdjacentHTML('beforeend', `
        <div class="diagnostic-banner danger">
          <strong>⚠ This home page has never been published.</strong>
          Visitors currently see the default EduCore content. Click
          <strong>🚀 Publish live</strong> below to make your edits visible to the public.
        </div>`);
    } else if(draftIsDifferent){
      bar.insertAdjacentHTML('beforeend', `
        <div class="diagnostic-banner warn">
          <strong>● You have unpublished changes.</strong>
          The live page shows the last-published version. Click
          <strong>🚀 Publish live</strong> below to update the public page.
        </div>`);
    }

    /* PATCH: config diagnostics */
    const diagnostics = [];
    if(state.config.carousel && state.config.carousel.enabled
       && (!Array.isArray(state.config.carousel.slides) || !state.config.carousel.slides.length)){
      diagnostics.push('Carousel is enabled but has no slides — it will be skipped. Add slides in the Carousel tab.');
    }
    if(state.config.welcome && state.config.welcome.enabled
       && !state.config.welcome.message && !state.config.welcome.headName){
      diagnostics.push('Welcome section is enabled but has no message or name — it will not render.');
    }
    if(state.config.programs && state.config.programs.enabled
       && (!Array.isArray(state.config.programs.tiers) || !state.config.programs.tiers.length)){
      diagnostics.push('Programs section is enabled but has no cards.');
    }
    if(state.config.contact && state.config.contact.enabled
       && state.config.contact.showEnquiryForm !== false
       && !state.config.contact.email && !(E.readStore(E.STORE_KEYS.settings, {}) || {}).email){
      diagnostics.push('Contact section has no email set and the school settings have none either — visitors will see the default.');
    }
    if(diagnostics.length){
      bar.insertAdjacentHTML('beforeend', `
        <div class="diagnostic-banner warn">
          <strong>⚠ ${diagnostics.length} config warning${diagnostics.length===1?'':'s'}:</strong>
          <ul>${diagnostics.map(d => `<li>${E.esc(d)}</li>`).join('')}</ul>
        </div>`);
    }
  }

  /* ---------- TABS ---------- */
  const TABS = [
    { key:'hero',        label:'🎯 Hero',        panel: paintHeroPanel },
    { key:'carousel',    label:'🎞 Carousel',    panel: paintCarouselPanel },
    { key:'ticker',      label:'📢 Ticker',      panel: paintTickerPanel },
    { key:'welcome',     label:'👋 Welcome',     panel: paintWelcomePanel },
    { key:'quickFacts',  label:'📊 Quick Facts', panel: paintQuickFactsPanel },
    { key:'programs',    label:'📚 Programs',    panel: paintProgramsPanel },
    { key:'whyChooseUs', label:'✨ Why Us',      panel: paintWhyChooseUsPanel },
    { key:'gallery',     label:'🖼 Gallery',     panel: paintGalleryPanel },
    { key:'leadership',  label:'👥 Leadership',  panel: paintLeadershipPanel },
    { key:'verify',      label:'🔍 Verify',      panel: paintVerifyPanel },
    { key:'hiring',      label:'💼 Hiring',      panel: paintHiringPanel },
    { key:'contact',     label:'✉ Contact',     panel: paintContactPanel },
    { key:'footer',      label:'🦶 Footer',      panel: paintFooterPanel }
  ];

  function paintTabs(){
    const wrap = document.getElementById('tabsWrap');
    wrap.innerHTML = TABS.map(t => {
      const cfg = state.config[t.key];
      const enabled = !cfg || cfg.enabled !== false;
      return `<button class="tab-btn ${state.activeTab === t.key ? 'active' : ''}"
        data-tab="${t.key}">
        <span class="dot" style="background:${enabled ? '#58a4ff' : '#94a3b8'}"></span>
        ${t.label}
      </button>`;
    }).join('');

    wrap.querySelectorAll('[data-tab]').forEach(btn => {
      btn.addEventListener('click', () => {
        state.activeTab = btn.dataset.tab;
        paintTabs();
        paintPanels();
      });
    });
  }

  function paintPanels(){
    const wrap = document.getElementById('panelsWrap');
    const tab = TABS.find(t => t.key === state.activeTab);
    if(!tab){ wrap.innerHTML = ''; return; }
    wrap.innerHTML = tab.panel();
    bindPanelEvents();
    refreshPreview();
  }

  /* ---------- HELPERS ---------- */
  function esc(s){ return E.esc(s); }
  function val(s){ return s == null ? '' : String(s); }

  function setDeep(path, value){
    const parts = path.split('.');
    let obj = state.config;
    for(let i = 0; i < parts.length - 1; i++){
      if(!obj[parts[i]]) obj[parts[i]] = {};
      obj = obj[parts[i]];
    }
    obj[parts[parts.length - 1]] = value;
    markChanged();
  }

  function getDeep(path){
    const parts = path.split('.');
    let obj = state.config;
    for(const p of parts){
      if(obj == null) return undefined;
      obj = obj[p];
    }
    return obj;
  }

  function toggleRow(path, label){
    const cur = getDeep(path) !== false;
    return `<div class="toggle-row">
      <input type="checkbox" data-path="${path}" ${cur ? 'checked' : ''} id="tgl-${path.replace(/\./g,'-')}">
      <label for="tgl-${path.replace(/\./g,'-')}">${label}</label>
    </div>`;
  }

  function fieldText(path, label, opts){
    opts = opts || {};
    const v = val(getDeep(path));
    const help = opts.help ? `<span class="help">${opts.help}</span>` : '';
    if(opts.textarea){
      return `<div class="field">
        <label>${label}</label>
        <textarea data-path="${path}" rows="${opts.rows || 4}"
          placeholder="${esc(opts.placeholder || '')}">${esc(v)}</textarea>
        ${help}
      </div>`;
    }
    return `<div class="field">
      <label>${label}</label>
      <input type="${opts.type || 'text'}" data-path="${path}"
        value="${esc(v)}" placeholder="${esc(opts.placeholder || '')}"
        ${opts.min != null ? 'min="' + opts.min + '"' : ''}
        ${opts.max != null ? 'max="' + opts.max + '"' : ''}>
      ${help}
    </div>`;
  }

  function fieldImage(path, label, wide){
    const v = getDeep(path);
    return `<div class="field">
      <label>${label}</label>
      <div class="img-field">
        <div class="img-preview ${wide ? 'wide' : ''}">
          ${v ? `<img src="${esc(v)}" alt=""><button class="rm" data-rm-img="${path}">✕</button>` : 'No image'}
        </div>
        <div class="img-actions">
          <input type="file" accept="image/*" data-upload="${path}" style="display:none">

  /* ---------- EVENT BINDING ---------- */
  function bindPanelEvents(){
    const wrap = document.getElementById('panelsWrap');

    /* Text inputs */
    wrap.querySelectorAll('[data-path]').forEach(el => {
      if(el.tagName === 'SELECT'){
        el.addEventListener('change', () => {
          const path = el.dataset.path;
          let v = el.value;
          if(v === 'true') v = true;
          else if(v === 'false') v = false;
          else if(el.type === 'number') v = Number(v);
          setDeep(path, v);
          /* Re-render if this toggles conditional sections */
          if(path === 'hero.statsSource' || path === 'quickFacts.statsSource'){
            paintPanels();
          } else {
            refreshPreview();
            paintStatusBar();
          }
        });
      } else if(el.type === 'checkbox'){
        el.addEventListener('change', () => {
          setDeep(el.dataset.path, el.checked);
          if(el.dataset.path.endsWith('.enabled')){
            paintTabs();
            refreshPreview();
            paintStatusBar();
          } else {
            refreshPreview();
          }
        });
      } else if(el.type === 'file'){
        /* Handled separately */
      } else {
        el.addEventListener('input', () => {
          const path = el.dataset.path;
          let v = el.value;

  /* ---------- PATCH: debounced preview refresh + manual button ---------- */
  let __previewTimer = null;
  function refreshPreview(){
    clearTimeout(__previewTimer);
    __previewTimer = setTimeout(doRefreshPreview, 600);
  }
  function doRefreshPreview(){
    const frame = document.getElementById('previewFrame');
    const wrap = document.getElementById('frameWrap');
    const status = document.getElementById('previewStatus');
    if(!frame) return;
    try{
      E.saveHomepageDraft(state.config);
      frame.src = 'home.html?preview=1&_t=' + Date.now();
      const w = wrap.clientWidth;
      const scale = w / 1400;
      frame.style.transform = `scale(${scale})`;
      frame.style.height = (wrap.clientHeight / scale) + 'px';
      status.textContent = 'Updated ' + new Date().toLocaleTimeString();
    }catch(err){
      status.textContent = 'Preview failed: ' + (err.message || 'unknown');
      console.error('Preview refresh failed', err);
    }
  }

  /* ---------- PATCH: preview modal for tablet/mobile ---------- */
  function openPreviewModal(){
    E.openModal('Live preview', `
      <div class="full" style="height:70vh;border:1px solid #e8ebf2;border-radius:10px;overflow:hidden">
        <iframe src="home.html?preview=1&_t=${Date.now()}" style="width:100%;height:100%;border:0" title="Home page preview"></iframe>
      </div>`, null, null, true);
  }

  /* ---------- TOP ACTIONS ---------- */
  document.getElementById('saveBtn').addEventListener('click', () => {
    if(!canEdit){ E.toast("You don't have permission to edit."); return; }
    const res = E.saveHomepageDraft(state.config);
    if(!res.ok){ E.toast('Save failed.'); return; }
    state.hasChanges = false;
    paintStatusBar();
    paintFooterNote();
    E.toast('Draft saved.');
  });

  document.getElementById('publishBtn').addEventListener('click', async () => {
    if(!canPublish){ E.toast("You don't have permission to publish."); return; }
    const ok = await E.confirmModal({
      title: 'Publish to live?',
      message: 'This will make the current draft visible to everyone visiting the home page. Continue?',
      submitText: 'Publish'
    });
    if(!ok) return;
    const res = E.publishHomepage(state.config);
    if(!res.ok){ E.toast('Publish failed.'); return; }
    state.hasChanges = false;
    paintStatusBar();
    paintFooterNote();
    E.toast('Published to live.');
  });

  document.getElementById('discardBtn').addEventListener('click', async () => {
    const ok = await E.confirmModal({
      title: 'Discard changes?',
      message: 'This will reload the last saved draft. Any unsaved changes will be lost.',
      submitText: 'Discard',
      danger: true
    });
    if(!ok) return;
    const fresh = E.getHomepageDraft() || E.getHomepageLive() || E.DEFAULT_HOMEPAGE;
    state.config = JSON.parse(JSON.stringify(fresh));
    state.hasChanges = false;
    paintTabs();
    paintPanels();
    paintStatusBar();
    paintFooterNote();
    E.toast('Discarded.');
  });

  document.getElementById('previewBtn').addEventListener('click', () => {
    window.open('home.html?preview=1', '_blank');
  });
  document.getElementById('previewBtn2').addEventListener('click', openPreviewModal);
  document.getElementById('manualRefreshBtn')?.addEventListener('click', doRefreshPreview);

  /* ---------- INIT ---------- */
  paintHeader();
  paintStatusBar();
  paintTabs();
  paintPanels();
  paintFooterNote();
})();
</script>
