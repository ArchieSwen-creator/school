<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Subjects | EduCore</title>
<style>
  :root{
    --navy:#12315a;--navy2:#14213d;--blue:#3987ee;--pale:#eef5ff;--border:#d8e4f2;
    --text:#23354d;--muted:#73849a;--green:#14805e;--orange:#d88922;--red:#d64545;
    --gold:#c99a2e;--gold2:#fff4d6;--bg:#f5f7fb;--line:#e8ebf2;--white:#fff;
    --shadow:0 8px 24px rgba(24,42,78,.06);
  }
  *{box-sizing:border-box}
  body{margin:0;padding:64px 16px 40px;
    background:linear-gradient(135deg,#edf4fc,#dfeaf7);
    font-family:Arial,Helvetica,sans-serif;color:var(--text);min-height:100vh}
  button,input,select,textarea{font:inherit}
  button{cursor:pointer}

  .page{width:100%;max-width:1200px;margin:0 auto}

  .band{
    background:linear-gradient(120deg,#102949,#245d9c);color:#fff;
    border-radius:16px;padding:22px 28px;margin-bottom:20px;
    box-shadow:0 18px 50px #16345417;display:flex;justify-content:space-between;
    align-items:center;gap:16px;flex-wrap:wrap;border-top:5px solid #58a4ff;
  }
  .band-left{display:flex;align-items:center;gap:14px}
  .band-logo{width:48px;height:48px;border-radius:50%;background:#fff;display:grid;place-items:center;
    overflow:hidden;color:var(--navy);font-weight:900;font-size:18px;border:3px solid #d8e8ff;flex:0 0 48px}
  .band-logo img{width:100%;height:100%;object-fit:contain}
  .band h1{margin:0;font-size:19px;letter-spacing:.3px;text-transform:uppercase}
  .band p{margin:4px 0 0;font-size:11px;color:#cfdcf5}
  .band-user{display:flex;align-items:center;gap:10px;font-size:11px;color:#cfdcf5;
    background:#ffffff14;border:1px solid #ffffff36;padding:7px 12px;border-radius:20px}
  .band-user strong{color:#fff}

  .toolbar{display:flex;justify-content:space-between;gap:12px;align-items:center;
    flex-wrap:wrap;margin-bottom:16px}
  .toolbar-left{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
  .field,.pick{border:1px solid var(--line);border-radius:9px;padding:10px 12px;
    background:#fff;color:var(--text);font-size:12px;outline:none}
  .field{min-width:230px}
  .field:focus,.pick:focus{border-color:var(--blue)}

  .btn{border:0;border-radius:9px;padding:11px 15px;background:var(--blue);color:#fff;
    font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:7px}
  .btn:hover{filter:brightness(.96)}
  .btn.secondary{background:#eef2fb;color:#34415c}
  .btn.outline{background:#fff;color:#34415c;border:1px solid var(--line)}
  .btn.danger{background:#fff0f1;color:var(--red)}
  .btn.green{background:#e6f7f0;color:#16835f}
  .btn.warn{background:#fff2dd;color:#a86414}
  .btn:disabled{opacity:.5;cursor:not-allowed}

  .card{background:#fff;border:1px solid var(--line);border-radius:13px;
    box-shadow:var(--shadow);overflow:hidden}
  .card-head{display:flex;justify-content:space-between;align-items:center;
    padding:18px 22px;border-bottom:1px solid var(--line);gap:12px;flex-wrap:wrap}
  .card-head h3{margin:0;font-size:14px}
  .card-head .count{padding:4px 9px;border-radius:20px;background:#edf2ff;color:#3b5cc1;
    font-size:10px;font-weight:800}

  .table-wrap{overflow-x:auto}
  table{width:100%;border-collapse:collapse;white-space:nowrap}
  th{text-align:left;background:#fafbfe;color:#7a8498;font-size:10px;
    text-transform:uppercase;letter-spacing:.6px;padding:13px 18px;
    border-bottom:1px solid var(--line)}
  td{padding:14px 18px;border-bottom:1px solid #f0f2f7;font-size:12px}
  tbody tr:last-child td{border-bottom:0}

  .code-pill{display:inline-block;padding:5px 10px;border-radius:20px;
    background:#14213d;color:#fff;font-size:10px;font-weight:800;letter-spacing:.5px;
    font-family:monospace}
  .code-pill.archived{background:#eef1f6;color:#59647c}

  .pill{display:inline-block;padding:5px 8px;border-radius:20px;font-size:10px;font-weight:700}
  .pill.green{background:#e6f7f0;color:#16835f}
  .pill.grey{background:#eef1f6;color:#59647c}

  .row-actions{display:flex;gap:5px;flex-wrap:wrap}
  .row-actions .btn{padding:8px 10px;font-size:11px}

  .empty{padding:40px 20px;text-align:center;color:var(--muted);font-size:13px}

  .usage-cell{font-size:11px;color:var(--muted)}

  @media (max-width:650px){
    body{padding:64px 8px 24px}
    .band{padding:18px 20px}
    .band h1{font-size:15px}
    .field{min-width:0;width:100%}
    .toolbar{flex-direction:column;align-items:stretch}
    .toolbar-left{width:100%}
  }
</style>
</head>
<body>

<div class="page">

  <div class="band">
    <div class="band-left">
      <div class="band-logo" id="bandLogo">DS</div>
      <div>
        <h1 id="bandSchool">Subjects</h1>
        <p id="bandSub">Central registry of every subject taught at this school</p>
      </div>
    </div>
    <div class="band-user">
      Signed in as <strong id="bandUser">—</strong>
    </div>
  </div>

  <div class="toolbar">
    <div class="toolbar-left">
      <input class="field" id="search" placeholder="Search code, name, department...">
      <select class="pick" id="statusFilter">
        <option value="">All subjects</option>
        <option value="active">Active only</option>
        <option value="archived">Archived only</option>
      </select>
    </div>
    <div class="toolbar-left">
      <button class="btn" id="addBtn">＋ Add subject</button>
    </div>
  </div>

  <div class="card">
    <div class="card-head">
      <h3>All subjects <span class="count" id="count">0</span></h3>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Code</th>
            <th>Name</th>
            <th>Department</th>
            <th>Used in</th>
            <th>Status</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>

</div>

<script src="educore-shared.js"></script>
<script>
(function(){
  'use strict';
  const E = window.EduCore;

  /* ---------- GUARD ---------- */
  const user = E.requirePerm('classes', 'Subjects');
  if(!user) return;

  /* ---------- SUB-FEATURE PERMISSIONS ----------
     The Subjects page is gated by the `classes` menu,
     so sub-features come from the `classes` menu keys. */
  const canAdd     = E.can('classes.add');
  const canEdit    = E.can('classes.add');
  const canDelete  = E.can('classes.delete');
  const canArchive = E.can('classes.archive');

  /* ---------- HEADER ---------- */
  function paintHeader(){
    const settings = E.readStore(E.STORE_KEYS.settings, {}) || {};
    const name = settings.name || 'EduCore High School';
    if(settings.logo){
      document.getElementById('bandLogo').innerHTML = `<img src="${settings.logo}" alt="">`;
    } else {
      document.getElementById('bandLogo').textContent =
        name.split(/\s+/).filter(Boolean).slice(0,2).map(w => w[0]).join('').toUpperCase() || 'EC';
    }
    document.getElementById('bandSchool').textContent = name;
    document.getElementById('bandSub').textContent = 'Central registry of every subject taught at this school';
    document.getElementById('bandUser').textContent = user.name || user.username;
  }

  /* ---------- USAGE ---------- */
  function usageOf(code){
    const classes = E.readStore(E.STORE_KEYS.classes, []) || [];
    const assignments = E.readStore(E.STORE_KEYS.assignments, []) || [];
    const results = E.readStore(E.STORE_KEYS.results, []) || [];
    const subjName = E.subjectName(code);

    const inClasses = classes.filter(c => (c.subjects||[]).includes(code)).length;
    const inAsn = assignments.filter(a => a.subject === code).length;
    const inResults = results.filter(r => r.subject === subjName || r.subject === code).length;
    return { inClasses, inAsn, inResults, total: inClasses + inAsn + inResults };
  }

  /* ---------- RENDER ---------- */
  function paintTable(){
    const subjects = E.getSubjects(true);
    const q = document.getElementById('search').value.toLowerCase();
    const st = document.getElementById('statusFilter').value;

    const arr = subjects.filter(s => {
      const matches = !q || (`${s.code} ${s.name} ${s.department||''}`).toLowerCase().includes(q);
      if(!matches) return false;
      if(st === 'active' && s.archived) return false;
      if(st === 'archived' && !s.archived) return false;
      return true;
    });

    const tb = document.getElementById('tbody');
    tb.innerHTML = arr.map(s => {
      const use = usageOf(s.code);
      const usageBits = [];
      if(use.inClasses)   usageBits.push(`${use.inClasses} class${use.inClasses===1?'':'es'}`);
      if(use.inAsn)       usageBits.push(`${use.inAsn} assignment${use.inAsn===1?'':'s'}`);
      if(use.inResults)   usageBits.push(`${use.inResults} result${use.inResults===1?'':'s'}`);
      const usageHTML = usageBits.length
        ? `<span class="usage-cell">${usageBits.join(' · ')}</span>`
        : `<span class="usage-cell" style="color:#9b3038">Unused</span>`;

      return `<tr>
        <td><span class="code-pill ${s.archived?'archived':''}">${E.esc(s.code)}</span></td>
        <td><strong>${E.esc(s.name)}</strong></td>
        <td>${E.esc(s.department||'—')}</td>
        <td>${usageHTML}</td>
        <td>${s.archived ? '<span class="pill grey">Archived</span>' : '<span class="pill green">Active</span>'}</td>
        <td>
          <div class="row-actions">
            ${canEdit ? `<button class="btn secondary" data-edit="${E.esc(s.code)}">Edit</button>` : ''}
            ${canArchive ? `<button class="btn ${s.archived?'green':'warn'}" data-toggle="${E.esc(s.code)}">${s.archived?'Restore':'Archive'}</button>` : ''}
            ${canDelete ? `<button class="btn danger" data-delete="${E.esc(s.code)}">Delete</button>` : ''}
          </div>
        </td>
      </tr>`;
    }).join('') || '<tr><td colspan="6" class="empty">No subjects match your search.</td></tr>';

    document.getElementById('count').textContent = arr.length;
  }

  /* ---------- ADD / EDIT ---------- */
  function openSubjectModal(existingCode){
    const isNew = !existingCode;
    const s = isNew ? { code:'', name:'', department:'' } : E.subjectByCode(existingCode);
    if(!s) return;

    const html = `
      <div><label>Code</label>
        <input name="code" required maxlength="6" value="${E.esc(s.code)}"
          ${isNew ? '' : 'readonly style="background:#f4f6fb;color:#7a8498"'}
          placeholder="e.g. MATH">
        <small style="color:var(--muted);font-size:10px;margin-top:4px;display:block">
          Short uppercase identifier (2–6 letters/digits)
        </small>
      </div>
      <div><label>Name</label>
        <input name="name" required value="${E.esc(s.name)}" placeholder="e.g. Mathematics">
      </div>
      <div class="full"><label>Department</label>
        <input name="department" value="${E.esc(s.department||'')}" placeholder="e.g. Sciences, Languages">
      </div>`;

    E.openModal(isNew ? 'Add subject' : `Edit subject · ${s.code}`, html,
      isNew ? 'Add subject' : 'Save changes',
      d => {
        const list = E.readStore(E.STORE_KEYS.subjects, []) || [];
        const codeUpper = String(d.code).toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 6);
        if(isNew){
          if(!codeUpper){ E.toast('Enter a valid code.'); return; }
          if(list.some(x => x.code === codeUpper)){ E.toast('That code is already used.'); return; }
          list.push({ code: codeUpper, name: d.name.trim(), department: (d.department||'').trim(), archived: false });
          E.audit('create', `Subject ${codeUpper}`, '', d.name);
        } else {
          const target = list.find(x => x.code === existingCode);
          if(!target) return;
          target.name = d.name.trim();
          target.department = (d.department||'').trim();
          E.audit('update', `Subject ${existingCode}`, '', d.name);
        }
        E.writeStore(E.STORE_KEYS.subjects, list);
        E.closeModal();
        paintTable();
        E.toast('Subject saved.');
      });
  }

  /* ---------- TOGGLE ARCHIVE ---------- */
  function toggleArchive(code){
    const list = E.readStore(E.STORE_KEYS.subjects, []) || [];
    const s = list.find(x => x.code === code);
    if(!s) return;
    if(!s.archived){
      if(!confirm(`Archive subject "${s.name}"?\n\nIt will no longer appear in pickers, but historical results are kept.`)) return;
    }
    s.archived = !s.archived;
    E.writeStore(E.STORE_KEYS.subjects, list);
    E.audit('update', `Subject ${code}`, '', s.archived ? 'archived' : 'restored');
    paintTable();
    E.toast(s.archived ? 'Subject archived.' : 'Subject restored.');
  }

  /* ---------- DELETE ---------- */
  function deleteSubject(code){
    const s = E.subjectByCode(code);
    if(!s) return;

    const use = usageOf(code);
    if(use.total > 0){
      const bits = [];
      if(use.inClasses) bits.push(`• used in ${use.inClasses} class${use.inClasses===1?'':'es'}`);
      if(use.inAsn)     bits.push(`• used in ${use.inAsn} teaching assignment${use.inAsn===1?'':'s'}`);
      if(use.inResults) bits.push(`• referenced by ${use.inResults} result row${use.inResults===1?'':'s'}`);
      alert(
        `Cannot delete this subject — it is still in use:\n\n` +
        bits.join('\n') +
        `\n\nRemove it from those places first, or archive it instead.`
      );
      return;
    }

    if(!confirm(`Permanently delete subject "${s.name}" (${s.code})?\n\nThis cannot be undone.`)) return;
    const typed = prompt(`Type the subject code (${s.code}) to confirm:`);
    if(typed !== s.code){ E.toast('Confirmation did not match.'); return; }

    const list = (E.readStore(E.STORE_KEYS.subjects, []) || []).filter(x => x.code !== code);
    E.writeStore(E.STORE_KEYS.subjects, list);
    E.audit('delete', `Subject ${code}`, s.name, '');
    paintTable();
    E.toast('Subject deleted.');
  }

  /* ---------- EVENTS ---------- */
  document.getElementById('search').addEventListener('input', paintTable);
  document.getElementById('statusFilter').addEventListener('change', paintTable);
  document.getElementById('addBtn').addEventListener('click', () => openSubjectModal(null));

  document.getElementById('tbody').addEventListener('click', e => {
    const edit   = e.target.closest('[data-edit]');
    const toggle = e.target.closest('[data-toggle]');
    const del    = e.target.closest('[data-delete]');
    if(edit)   openSubjectModal(edit.dataset.edit);
    if(toggle) toggleArchive(toggle.dataset.toggle);
    if(del)    deleteSubject(del.dataset.delete);
  });

  /* ---------- INIT ---------- */
  paintHeader();
  paintTable();
  if(!canAdd) document.getElementById('addBtn').style.display = 'none';
})();
</script>
</body>
</html>
